<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAPLY - Roblox Limited Tracker</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for JSX compilation in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/lucide-react@latest/dist/umd/lucide-react.js"></script>
</head>
<body class="bg-[#050505] text-[#F5F5F5] m-0 p-0">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, useRef } = React;
    const { 
      Search, Plus, TrendingUp, TrendingDown, RefreshCw, 
      Trash2, X, Download, Upload, Star, Clock, 
      Settings: SettingsIcon, LayoutDashboard, Wallet,
      ChevronRight, Activity, AlertCircle, CheckCircle2,
      User, Image: ImageIcon, Box, Heart, Bell, Check, Edit3, ExternalLink
    } = LucideReact;

    // ==========================================
    // CACHE & STORAGE (Camada de Armazenamento Robusta)
    // ==========================================

    const apiCache = {
      store: new Map(),
      set(key, data, ttlSeconds = 60) {
        this.store.set(key, { data, expiry: Date.now() + ttlSeconds * 1000 });
      },
      get(key) {
        const item = this.store.get(key);
        if (!item) return null;
        if (Date.now() > item.expiry) {
          this.store.delete(key);
          return null;
        }
        return item.data;
      }
    };

    const formatRobux = (value, format = 'suffix') => {
      const num = Math.round(Number(value) || 0);
      const formatted = new Intl.NumberFormat('en-US').format(num);
      return format === 'suffix' ? `${formatted} R$` : `R$ ${formatted}`;
    };

    const normalizeItem = (item) => ({
      id: String(item.id || Date.now()),
      assetId: String(item.assetId || ''),
      name: String(item.name || 'Unknown Item'),
      imageUrl: String(item.imageUrl || ''),
      assetType: String(item.assetType || 'Asset'),
      isLimited: Boolean(item.isLimited),
      isLimitedUnique: Boolean(item.isLimitedUnique),
      saleStatus: String(item.saleStatus || 'Available'),
      rap: Math.max(0, Number(item.rap) || 0),
      currentPrice: Math.max(0, Number(item.currentPrice) || 0),
      lowestResellerPrice: Math.max(0, Number(item.lowestResellerPrice) || 0),
      boughtPrice: Math.max(0, Number(item.boughtPrice) || 0),
      quantity: Math.max(1, Number(item.quantity) || 1),
      isFavorite: Boolean(item.isFavorite),
      history: Array.isArray(item.history) ? item.history : [],
      resellers: Array.isArray(item.resellers) ? item.resellers : [],
      dateBought: item.dateBought || new Date().toISOString(),
      lastUpdated: item.lastUpdated || new Date().toISOString()
    });

    const normalizeWishlistItem = (item) => ({
      id: String(item.id || Date.now()),
      assetId: String(item.assetId || ''),
      name: String(item.name || 'Unknown Item'),
      imageUrl: String(item.imageUrl || ''),
      currentPrice: Math.max(0, Number(item.currentPrice) || 0),
      targetPrice: Math.max(0, Number(item.targetPrice) || 0),
      availableRobux: Math.max(0, Number(item.availableRobux) || 0),
      isAffordable: Boolean(item.isAffordable),
      viewed: Boolean(item.viewed),
      createdAt: item.createdAt || new Date().toISOString()
    });

    const normalizeSettings = (settings) => ({
      autoRefresh: settings?.autoRefresh !== undefined ? Boolean(settings.autoRefresh) : true,
      refreshInterval: Number(settings?.refreshInterval) || 60,
      currencyFormat: settings?.currencyFormat === 'prefix' ? 'prefix' : 'suffix',
      theme: 'dark',
      profile: {
        username: String(settings?.profile?.username || ''),
        userId: String(settings?.profile?.userId || ''),
        displayName: String(settings?.profile?.displayName || ''),
        avatarUrl: String(settings?.profile?.avatarUrl || ''),
        customImage: String(settings?.profile?.customImage || ''),
        customAssetId: String(settings?.profile?.customAssetId || '')
      }
    });

    const storage = {
      getItems: () => {
        try {
          const data = localStorage.getItem('raply_items');
          return data ? JSON.parse(data).map(normalizeItem) : [];
        } catch (e) { return []; }
      },
      saveItems: (items) => {
        try { localStorage.setItem('raply_items', JSON.stringify(items)); } catch (e) {}
      },
      getWishlist: () => {
        try {
          const data = localStorage.getItem('raply_wishlist');
          return data ? JSON.parse(data).map(normalizeWishlistItem) : [];
        } catch (e) { return []; }
      },
      saveWishlist: (wishlist) => {
        try { localStorage.setItem('raply_wishlist', JSON.stringify(wishlist)); } catch (e) {}
      },
      getNotifications: () => {
        try {
          const data = localStorage.getItem('raply_notifications');
          return data ? JSON.parse(data) : [];
        } catch (e) { return []; }
      },
      saveNotifications: (notes) => {
        try { localStorage.setItem('raply_notifications', JSON.stringify(notes)); } catch (e) {}
      },
      getSettings: () => {
        try {
          const data = localStorage.getItem('raply_settings');
          return normalizeSettings(data ? JSON.parse(data) : {});
        } catch (e) { return normalizeSettings({}); }
      },
      saveSettings: (settings) => {
        try { localStorage.setItem('raply_settings', JSON.stringify(normalizeSettings(settings))); } catch (e) {}
      }
    };

    // ==========================================
    // ROBLOX API LAYER (Resiliente, com Fallbacks)
    // ==========================================

    const RobloxAPI = {
      endpoints: {
        info: (id) => `https://api.roproxy.com/marketplace/productinfo?assetId=${id}`,
        resale: (id) => `https://economy.roproxy.com/v1/assets/${id}/resale-data`,
        resellers: (id) => `https://economy.roproxy.com/v1/assets/${id}/resellers?limit=10`,
        thumbnail: (id) => `https://thumbnails.roproxy.com/v1/assets?assetIds=${id}&returnPolicy=PlaceHolder&size=150x150&format=Png&isCircular=false`,
        userSearch: (username) => `https://users.roproxy.com/v1/users/search?keyword=${encodeURIComponent(username)}&limit=10`,
        userInfo: (userId) => `https://users.roproxy.com/v1/users/${userId}`,
        userAvatar: (userId) => `https://thumbnails.roproxy.com/v1/users/avatar-headshot?userIds=${userId}&size=150x150&format=Png&isCircular=true`
      },

      async getAssetThumbnail(assetId) {
        const cacheKey = `thumb_${assetId}`;
        const cached = apiCache.get(cacheKey);
        if (cached) return cached;

        try {
          const res = await fetch(this.endpoints.thumbnail(assetId));
          if (!res.ok) return '';
          const data = await res.json();
          const url = data.data?.[0]?.imageUrl || '';
          if (url) apiCache.set(cacheKey, url, 300);
          return url;
        } catch (e) {
          return '';
        }
      },

      async getAsset(assetId) {
        const cacheKey = `asset_${assetId}`;
        const cached = apiCache.get(cacheKey);
        if (cached) return cached;

        const res = await fetch(this.endpoints.info(assetId));
        if (!res.ok) throw new Error('Asset not found');
        const info = await res.json();
        
        const isLimited = Boolean(info.IsLimited || info.IsLimitedUnique);
        const assetType = info.AssetTypeName || info.Type || 'Asset';
        const saleStatus = info.IsForSale ? 'For Sale' : 'Off Sale';

        let rap = 0;
        let currentPrice = Number(info.PriceInRobux) || 0;
        let lowestResellerPrice = 0;
        let resellers = [];

        if (isLimited) {
          try {
            const resaleRes = await fetch(this.endpoints.resale(assetId));
            if (resaleRes.ok) {
              const resaleData = await resaleRes.json();
              rap = Number(resaleData.recentAveragePrice) || 0;
              currentPrice = rap;
            }
          } catch (e) {}

          try {
            const resellersRes = await fetch(this.endpoints.resellers(assetId));
            if (resellersRes.ok) {
              const resellersData = await resellersRes.json();
              if (resellersData.data) {
                resellers = resellersData.data.map(r => ({
                  price: Number(r.price) || 0,
                  sellerName: r.seller?.name || r.sellerName || 'Roblox User',
                  sellerId: r.seller?.id || r.sellerId || 0,
                  quantity: Number(r.assetStock) || 1
                }));
                if (resellers.length > 0) {
                  lowestResellerPrice = Math.min(...resellers.map(r => r.price));
                  currentPrice = lowestResellerPrice;
                }
              }
            }
          } catch (e) {}
        }

        const imageUrl = await this.getAssetThumbnail(assetId);

        const result = {
          assetId: String(assetId),
          name: info.Name || `Asset #${assetId}`,
          imageUrl,
          assetType,
          isLimited,
          isLimitedUnique: Boolean(info.IsLimitedUnique),
          saleStatus,
          rap,
          currentPrice: currentPrice || rap || Number(info.PriceInRobux) || 0,
          lowestResellerPrice,
          resellers
        };

        apiCache.set(cacheKey, result, 60);
        return result;
      },

      async getUser(usernameOrId) {
        const queryStr = String(usernameOrId).trim();
        let userId = '';
        let username = '';
        let displayName = '';

        if (/^\d+$/.test(queryStr)) {
          userId = queryStr;
          const infoRes = await fetch(this.endpoints.userInfo(userId));
          if (!infoRes.ok) throw new Error('User not found');
          const info = await infoRes.json();
          username = info.name;
          displayName = info.displayName || info.name;
        } else {
          const cleanName = queryStr.startsWith('@') ? queryStr.substring(1) : queryStr;
          const searchRes = await fetch(this.endpoints.userSearch(cleanName));
          if (!searchRes.ok) throw new Error('Failed to search user');
          const searchData = await searchRes.json();
          const match = searchData.data?.find(u => u.name.toLowerCase() === cleanName.toLowerCase());
          if (!match) throw new Error('User not found');
          userId = String(match.id);
          username = match.name;
          displayName = match.displayName || match.name;
        }

        let avatarUrl = '';
        try {
          const avatarRes = await fetch(this.endpoints.userAvatar(userId));
          if (avatarRes.ok) {
            const avatarData = await avatarRes.json();
            avatarUrl = avatarData.data?.[0]?.imageUrl || '';
          }
        } catch (e) {}

        return { userId, username, displayName, avatarUrl };
      }
    };


    // ==========================================
    // UI COMPONENTS
    // ==========================================

    const AnimatedNumber = ({ value, formatFn, className }) => {
      const [displayValue, setDisplayValue] = useState(value);
      
      useEffect(() => {
        if (displayValue === value) return;
        const duration = 500;
        const start = displayValue;
        const end = value;
        const startTime = performance.now();
        
        let animationFrame;
        const animate = (currentTime) => {
          const elapsed = currentTime - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const ease = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
          setDisplayValue(start + (end - start) * ease);
          if (progress < 1) animationFrame = requestAnimationFrame(animate);
          else setDisplayValue(end);
        };
        animationFrame = requestAnimationFrame(animate);
        return () => cancelAnimationFrame(animationFrame);
      }, [value]);

      return <span className={className}>{formatFn(displayValue)}</span>;
    };

    const RobloxImage = ({ src, alt, className, type = 'asset' }) => {
      const [hasError, setHasError] = useState(false);
      const [isLoaded, setIsLoaded] = useState(false);

      useEffect(() => { setHasError(false); setIsLoaded(false); }, [src]);

      return (
        <div className={`relative overflow-hidden flex items-center justify-center bg-[#050505] ${className}`}>
          {(!isLoaded && !hasError) && <div className="absolute inset-0 bg-[#111111] animate-pulse" />}
          {hasError || !src ? (
            type === 'user' ? <User className="w-1/2 h-1/2 text-[#2A2A2A]" /> : <Box className="w-1/2 h-1/2 text-[#2A2A2A]" />
          ) : (
            <img 
              src={src} alt={alt || ''}
              onLoad={() => setIsLoaded(true)}
              onError={() => setHasError(true)}
              className={`w-full h-full object-contain transition-opacity duration-300 ${isLoaded ? 'opacity-100' : 'opacity-0'}`} 
              loading="lazy"
            />
          )}
        </div>
      );
    };

    const SmoothSparkline = ({ data, isPositive }) => {
      if (!data || data.length < 2) return <div className="h-full w-full flex items-center justify-center text-[#8A8A8A] text-xs">Price history unavailable</div>;
      
      const min = Math.min(...data);
      const max = Math.max(...data);
      const range = max - min || 1;
      const padding = 10;
      
      const points = data.map((val, i) => {
        const x = (i / (data.length - 1)) * 100;
        const y = 100 - padding - ((val - min) / range) * (100 - padding * 2);
        return { x, y };
      });

      const pathD = points.reduce((acc, point, i, a) => {
        if (i === 0) return `M ${point.x},${point.y}`;
        const prev = a[i - 1];
        const cp1x = prev.x + (point.x - prev.x) / 2;
        const cp2x = prev.x + (point.x - prev.x) / 2;
        return `${acc} C ${cp1x},${prev.y} ${cp2x},${point.y} ${point.x},${point.y}`;
      }, '');

      const color = isPositive ? '#30D158' : '#FF453A';

      return (
        <svg className="w-full h-full overflow-visible animate-in fade-in duration-700" viewBox="0 0 100 100" preserveAspectRatio="none">
          <defs>
            <linearGradient id={`grad-${isPositive ? 'pos' : 'neg'}`} x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stopColor={color} stopOpacity="0.2" />
              <stop offset="100%" stopColor={color} stopOpacity="0" />
            </linearGradient>
          </defs>
          <path d={`${pathD} L 100,100 L 0,100 Z`} fill={`url(#grad-${isPositive ? 'pos' : 'neg'})`} />
          <path d={pathD} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="opacity-80" />
        </svg>
      );
    };

    const Modal = ({ isOpen, onClose, title, children, maxWidth = 'max-w-md' }) => {
      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-end md:items-center justify-center p-0 md:p-4">
          <div className="absolute inset-0 bg-black/60 backdrop-blur-sm animate-in fade-in duration-200" onClick={onClose} />
          <div className={`relative bg-[#0A0A0A] md:border md:border-[#1A1A1A] w-full ${maxWidth} max-h-[90vh] rounded-t-[32px] md:rounded-2xl flex flex-col shadow-2xl
            animate-in slide-in-from-bottom-full md:slide-in-from-bottom-8 md:zoom-in-95 duration-300 ease-out`}>
            
            <div className="md:hidden w-full flex justify-center pt-3 pb-1" onClick={onClose}>
              <div className="w-12 h-1.5 bg-[#2A2A2A] rounded-full" />
            </div>

            <div className="flex justify-between items-center px-6 py-4 border-b border-[#1A1A1A]">
              <h3 className="text-lg font-semibold text-[#F5F5F5] tracking-tight">{title}</h3>
              <button onClick={onClose} className="p-2 -mr-2 text-[#8A8A8A] hover:text-[#F5F5F5] transition-colors rounded-full hover:bg-[#111111] hover:scale-105 active:scale-95">
                <X className="w-5 h-5" />
              </button>
            </div>
            
            <div className="p-6 overflow-y-auto custom-scrollbar">
              {children}
            </div>
          </div>
        </div>
      );
    };


    // ==========================================
    // MAIN APP COMPONENT
    // ==========================================

    function RaplyApp() {
      const [items, setItems] = useState([]);
      const [wishlist, setWishlist] = useState([]);
      const [notifications, setNotifications] = useState([]);
      const [settings, setSettings] = useState(normalizeSettings({}));
      const [activeTab, setActiveTab] = useState('home');
      const [isOnline, setIsOnline] = useState(navigator.onLine);
      const [lastUpdate, setLastUpdate] = useState(Date.now());
      const [apiStatus, setApiStatus] = useState('Connected');
      
      const [isAddOpen, setIsAddOpen] = useState(false);
      const [isWishlistAddOpen, setIsWishlistAddOpen] = useState(false);
      const [isSearchOpen, setIsSearchOpen] = useState(false);
      const [selectedItem, setSelectedItem] = useState(null);
      const [selectedWishlistItem, setSelectedWishlistItem] = useState(null);
      const [toasts, setToasts] = useState([]);
      const [isUpdating, setIsUpdating] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');

      useEffect(() => {
        setItems(storage.getItems());
        setWishlist(storage.getWishlist());
        setNotifications(storage.getNotifications());
        setSettings(storage.getSettings());

        const handleOnline = () => { setIsOnline(true); setApiStatus('Connected'); };
        const handleOffline = () => { setIsOnline(false); setApiStatus('Offline'); };
        window.addEventListener('online', handleOnline);
        window.addEventListener('offline', handleOffline);
        return () => {
          window.removeEventListener('online', handleOnline);
          window.removeEventListener('offline', handleOffline);
        };
      }, []);

      useEffect(() => { storage.saveItems(items); }, [items]);
      useEffect(() => { storage.saveWishlist(wishlist); }, [wishlist]);
      useEffect(() => { storage.saveNotifications(notifications); }, [notifications]);
      useEffect(() => { storage.saveSettings(settings); }, [settings]);

      useEffect(() => {
        if (wishlist.length === 0) return;
        let updated = false;
        const newWishlist = wishlist.map(w => {
          const isAffordable = w.currentPrice <= w.availableRobux;
          if (isAffordable && !w.isAffordable) {
            updated = true;
            const noteMsg = `Price Alert: ${w.name} is now within your budget (${formatRobux(w.currentPrice, settings.currencyFormat)})!`;
            setNotifications(prev => [{ id: Date.now() + Math.random(), message: noteMsg, viewed: false, time: new Date().toISOString() }, ...prev]);
            showToast(`Price Alert: ${w.name} is affordable!`, 'success');
          }
          return { ...w, isAffordable };
        });
        if (updated) setWishlist(newWishlist);
      }, [items, wishlist, settings.currencyFormat]);

      const showToast = useCallback((message, type = 'success') => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3500);
      }, []);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
            e.preventDefault();
            setIsSearchOpen(true);
          }
          if (e.key === 'Escape') {
            setIsSearchOpen(false); setIsAddOpen(false); setIsWishlistAddOpen(false); setSelectedItem(null); setSelectedWishlistItem(null);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      const refreshMarketData = useCallback(async () => {
        if ((items.length === 0 && wishlist.length === 0) || isUpdating || !isOnline) return;
        setIsUpdating(true);
        setApiStatus('Updating');
        let updatedCount = 0;
        
        try {
          const newItems = [...items];
          for (let i = 0; i < newItems.length; i++) {
            const item = newItems[i];
            try {
              const fresh = await RobloxAPI.getAsset(item.assetId);
              if (fresh.currentPrice !== item.currentPrice || fresh.rap !== item.rap) {
                const newHistory = item.isLimited ? [...item.history, fresh.currentPrice] : [];
                if (newHistory.length > 30) newHistory.shift();
                newItems[i] = { ...item, ...fresh, history: newHistory, lastUpdated: new Date().toISOString() };
                updatedCount++;
              }
            } catch (err) {}
            await new Promise(r => setTimeout(r, 150));
          }
          setItems(newItems);

          const newWish = [...wishlist];
          for (let i = 0; i < newWish.length; i++) {
            const w = newWish[i];
            try {
              const fresh = await RobloxAPI.getAsset(w.assetId);
              if (fresh.currentPrice !== w.currentPrice) {
                newWish[i] = { ...w, currentPrice: fresh.currentPrice, lastChecked: new Date().toISOString() };
                updatedCount++;
              }
            } catch (err) {}
            await new Promise(r => setTimeout(r, 150));
          }
          setWishlist(newWish);

          if (updatedCount > 0) setLastUpdate(Date.now());
          setApiStatus('Connected');
        } catch (e) {
          setApiStatus('API unavailable');
        } finally {
          setIsUpdating(false);
        }
      }, [items, wishlist, isUpdating, isOnline]);

      useEffect(() => {
        let interval;
        if (settings.autoRefresh && settings.refreshInterval > 0 && isOnline) {
          interval = setInterval(refreshMarketData, settings.refreshInterval * 1000);
        }
        return () => clearInterval(interval);
      }, [settings.autoRefresh, settings.refreshInterval, isOnline, refreshMarketData]);

      const stats = useMemo(() => {
        let totalValue = 0, totalInvested = 0, limitedsCount = 0;
        items.forEach(item => {
          totalValue += item.currentPrice * item.quantity;
          totalInvested += item.boughtPrice * item.quantity;
          if (item.isLimited) limitedsCount++;
        });
        const profit = totalValue - totalInvested;
        const roi = totalInvested > 0 ? (profit / totalInvested) * 100 : 0;
        return { 
          totalValue, 
          totalInvested, 
          profit, 
          roi, 
          isProfitable: profit >= 0,
          totalAssets: items.length,
          limitedsCount,
          wishlistCount: wishlist.length
        };
      }, [items, wishlist]);

      const profileDisplayImage = useMemo(() => {
        const p = settings.profile;
        if (p.customImage) return p.customImage;
        if (p.avatarUrl) return p.avatarUrl;
        return '';
      }, [settings.profile]);

      const unreadNotesCount = useMemo(() => notifications.filter(n => !n.viewed).length, [notifications]);

      const renderDashboard = () => (
        <div className="space-y-8 animate-in fade-in slide-in-from-bottom-4 duration-500 ease-out fill-mode-backwards">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4">
            <div>
              <h2 className="text-3xl font-bold text-[#F5F5F5] tracking-tight mb-1">Your Limiteds, at a glance.</h2>
              <div className="flex items-center gap-2 text-xs text-[#8A8A8A] font-medium transition-colors">
                {!isOnline ? (
                  <><Activity className="w-3.5 h-3.5 text-[#FF453A]" /><span className="text-[#FF453A]">Offline</span></>
                ) : isUpdating ? (
                  <><RefreshCw className="w-3.5 h-3.5 animate-spin text-[#30D158]" /><span className="text-[#30D158]">Updating...</span></>
                ) : (
                  <><Clock className="w-3.5 h-3.5" /><span>Status: <strong className="text-[#F5F5F5]">{apiStatus}</strong></span></>
                )}
              </div>
            </div>
            
            <div className="flex gap-2 w-full sm:w-auto">
              <button onClick={refreshMarketData} disabled={isUpdating || !isOnline} className="p-3 bg-[#111111] hover:bg-[#1A1A1A] active:scale-95 text-[#F5F5F5] rounded-xl border border-[#1A1A1A] transition-all disabled:opacity-50">
                <RefreshCw className={`w-5 h-5 ${isUpdating ? 'animate-spin' : ''}`} />
              </button>
              <button onClick={() => setIsAddOpen(true)} className="flex-1 sm:flex-none flex items-center justify-center gap-2 px-5 py-3 bg-[#F5F5F5] text-[#050505] hover:bg-white active:scale-95 rounded-xl font-semibold transition-all">
                <Plus className="w-5 h-5" /> Add Asset
              </button>
            </div>
          </div>

          <div className="grid grid-cols-2 md:grid-cols-6 gap-3">
            <div className="bg-[#0A0A0A] border border-[#1A1A1A] rounded-xl p-4 flex flex-col justify-between">

        const [idInput, setIdInput] = useState('');
        const [loading, setLoading] = useState(false);
        const [preview, setPreview] = useState(null);
        const [error, setError] = useState('');
        const [form, setForm] = useState({ boughtPrice: '', quantity: '1' });

        const handleSearch = async (e) => {
          e.preventDefault();
          if (!idInput.trim()) return;
          setLoading(true); setError(''); setPreview(null);
          try {
            const data = await RobloxAPI.getAsset(idInput.trim());
            setPreview(data);
            setForm({ boughtPrice: String(data.currentPrice || 0), quantity: '1' });
          } catch (err) {
            setError("Could not fetch asset. Check the Asset ID.");
          } finally { setLoading(false); }
        };

        const handleAdd = () => {
          if (!preview) return;
          const newItem = normalizeItem({
            ...preview,
            id: Date.now().toString(),
            boughtPrice: Number(form.boughtPrice) || 0,
            quantity: Number(form.quantity) || 1,
            history: preview.isLimited ? [preview.currentPrice] : []
          });
          setItems(prev => [...prev, newItem]);
          showToast("Asset added to portfolio");
          setIsAddOpen(false);
        };

        return (
          <Modal isOpen={isAddOpen} onClose={() => setIsAddOpen(false)} title="Add Asset">
            {!preview ? (
              <form onSubmit={handleSearch} className="space-y-4">
                <div>
                  <label className="block text-xs font-medium text-[#8A8A8A] mb-1.5 uppercase tracking-wider">Roblox Asset ID</label>
                  <input type="text" inputMode="numeric" value={idInput} onChange={e => setIdInput(e.target.value)} placeholder="e.g. 19027209" className="w-full bg-[#111111] border border-[#1A1A1A] text-[#F5F5F5] rounded-xl px-4 py-3 focus:outline-none focus:border-[#F5F5F5]" />
                </div>
                {error && <p className="text-xs text-[#FF453A]">{error}</p>}
                <button type="submit" disabled={loading || !idInput} className="w-full bg-[#F5F5F5] text-[#050505] font-semibold rounded-xl py-3 hover:bg-white active:scale-[0.98] transition-all disabled:opacity-50 flex justify-center">
                  {loading ? <RefreshCw className="w-5 h-5 animate-spin" /> : 'Search Asset'}
                </button>
              </form>
            ) : (
              <div className="space-y-6">
                <div className="flex items-center gap-4 bg-[#111111] p-3 rounded-xl border border-[#1A1A1A]">
                  <RobloxImage src={preview.imageUrl} className="w-12 h-12 rounded-lg bg-[#050505]" />
                  <div className="flex-1 min-w-0">
                    <p className="text-sm font-medium text-[#F5F5F5] truncate">{preview.name}</p>
                  </div>
                  <button onClick={() => setPreview(null)} className="p-2 text-[#8A8A8A] hover:text-[#F5F5F5]"><X className="w-4 h-4"/></button>
                </div>
                <button onClick={handleAdd} className="w-full bg-[#F5F5F5] text-[#050505] font-semibold rounded-xl py-3 hover:bg-white transition-all">
                  Add to Portfolio
                </button>
              </div>
            )}
          </Modal>
        );
      };

      const AddWishlistModal = () => null;
      const ItemDetailsModal = () => null;
      const WishlistDetailsModal = () => null;

      const NavItem = ({ id, icon, label, isMobile, badge }) => {
        const isActive = activeTab === id;
        if (isMobile) {
          return (
            <button onClick={() => setActiveTab(id)} className={`flex flex-col items-center justify-center w-full h-full gap-1 transition-all duration-300 relative ${isActive ? 'text-[#F5F5F5]' : 'text-[#8A8A8A] hover:text-[#D1D1D1]'}`}>
              {badge > 0 && <span className="absolute top-1 right-1/3 w-4 h-4 bg-[#FF453A] text-white text-[9px] font-bold rounded-full flex items-center justify-center">{badge}</span>}
              {React.cloneElement(icon, { className: `w-5 h-5` })}
              <span className="text-[10px] font-medium">{label}</span>
            </button>
          );
        }
        return (
          <button onClick={() => setActiveTab(id)} className={`w-full flex items-center justify-between px-4 py-2.5 rounded-xl transition-all duration-200 group ${isActive ? 'bg-[#111111] text-[#F5F5F5] font-medium' : 'text-[#8A8A8A] hover:text-[#F5F5F5] hover:bg-[#0A0A0A]'}`}>
            <div className="flex items-center gap-3">
              {React.cloneElement(icon, { className: `w-4 h-4` })}
              <span className="text-sm">{label}</span>
            </div>
            {badge > 0 && <span className="bg-[#FF453A] text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">{badge}</span>}
          </button>
        );
      };

      return (
        <div className="flex h-[100dvh] w-full bg-[#050505] text-[#F5F5F5] font-sans overflow-hidden">
          <aside className="hidden md:flex flex-col w-64 bg-[#050505] border-r border-[#1A1A1A] z-40 relative">
            <div className="h-20 flex items-center justify-between px-6">
              <h1 className="text-xl font-bold tracking-widest text-[#F5F5F5]">RAPLY</h1>
            </div>
            <nav className="flex-1 space-y-1 px-4">
              <NavItem id="home" icon={<LayoutDashboard />} label="Dashboard" />
              <NavItem id="portfolio" icon={<Wallet />} label="Portfolio" />
              <NavItem id="wishlist" icon={<Heart />} label="Wishlist" badge={wishlist.filter(w => w.isAffordable).length} />
              <NavItem id="favorites" icon={<Star />} label="Favorites" />
              <NavItem id="settings" icon={<SettingsIcon />} label="Settings" />
            </nav>
          </aside>

          <main className="flex-1 relative flex flex-col h-full overflow-hidden">
            <div className="flex-1 overflow-y-auto custom-scrollbar p-4 md:p-10 lg:p-12 pb-24 md:pb-12">
              <div className="max-w-5xl mx-auto h-full">
                {activeTab === 'home' && renderDashboard()}
                {activeTab === 'portfolio' && renderPortfolio()}
                {activeTab === 'wishlist' && renderWishlist()}
                {activeTab === 'favorites' && renderFavorites()}
                {activeTab === 'settings' && renderSettings()}
              </div>
            </div>
          </main>

          <nav className="md:hidden fixed bottom-0 inset-x-0 bg-[#0A0A0A]/90 backdrop-blur-xl border-t border-[#1A1A1A] z-40">
            <div className="flex justify-around items-center h-16 px-2">
              <NavItem id="home" icon={<LayoutDashboard />} label="Home" isMobile />
              <NavItem id="portfolio" icon={<Wallet />} label="Portfolio" isMobile />
              <NavItem id="wishlist" icon={<Heart />} label="Wishlist" isMobile badge={wishlist.filter(w => w.isAffordable).length} />
              <NavItem id="favorites" icon={<Star />} label="Favorites" isMobile />
              <NavItem id="settings" icon={<SettingsIcon />} label="Settings" isMobile />
            </div>
          </nav>

          <div className="fixed bottom-20 md:bottom-6 right-0 left-0 md:left-auto md:right-6 flex flex-col items-center md:items-end gap-2 z-[60] pointer-events-none px-4">
            {toasts.map(toast => (
              <div key={toast.id} className="pointer-events-auto flex items-center gap-3 bg-[#111111] border border-[#1A1A1A] text-[#F5F5F5] px-4 py-3 rounded-xl shadow-2xl">
                <CheckCircle2 className="w-4 h-4 text-[#30D158]" />
                <span className="text-sm font-medium">{toast.message}</span>
              </div>
            ))}
          </div>

          <AddModal />
          <SearchModal />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<RaplyApp />);
  </script>
</body>
</html>
