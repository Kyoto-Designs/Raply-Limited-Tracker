<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Raply By Pan • Ultimate</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Custom Configuration & Animations for Smoother UI -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: '#050505',
            surface: '#0A0A0A',
            border: '#1A1A1A'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    
    :root { 
      color-scheme: dark; 
    }
    
    body {
      background-color: #050505;
      color: #F5F5F5;
      -webkit-font-smoothing: antialiased;
    }

    .pb-safe { padding-bottom: max(16px, env(safe-area-inset-bottom)); }
    
    /* Elegant Custom Scrollbar */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #1A1A1A; border-radius: 6px; transition: background-color 0.3s; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: #2A2A2A; }
    
    /* Remove number input spinners */
    input[type="number"]::-webkit-inner-spin-button, 
    input[type="number"]::-webkit-outer-spin-button { 
      -webkit-appearance: none; margin: 0; 
    }

    /* ULTRA-SMOOTH ANIMATIONS
      Engineered custom keyframes to replace tailwindcss-animate plugin 
      with premium cubic-bezier easing for a buttery smooth feel.
    */
    .animate-in {
      animation-duration: 0.6s;
      animation-fill-mode: both;
      animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .fade-in { animation-name: fadeIn; }
    .slide-in-from-bottom-4 { animation-name: slideInBottom4; }
    .slide-in-from-bottom-6 { animation-name: slideInBottom6; }
    .slide-in-from-bottom-12 { animation-name: slideInBottom12; }
    .slide-in-from-bottom-full { animation-name: slideInBottomFull; }
    .slide-in-from-top-2 { animation-name: slideInTop2; }
    .slide-in-from-right-4 { animation-name: slideInRight4; }
    .slide-in-from-right-8 { animation-name: slideInRight8; }
    .zoom-in-95 { animation-name: zoomIn95; }
    .fill-mode-backwards { animation-fill-mode: backwards; }

    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes slideInBottom4 {
      0% { opacity: 0; transform: translateY(16px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideInBottom6 {
      0% { opacity: 0; transform: translateY(24px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideInBottom12 {
      0% { opacity: 0; transform: translateY(48px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideInBottomFull {
      0% { opacity: 0; transform: translateY(100%); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideInTop2 {
      0% { opacity: 0; transform: translateY(-8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideInRight4 {
      0% { opacity: 0; transform: translateX(16px); }
      100% { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideInRight8 {
      0% { opacity: 0; transform: translateX(32px); }
      100% { opacity: 1; transform: translateX(0); }
    }
    @keyframes zoomIn95 {
      0% { opacity: 0; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>

  <!-- ES Module Import Map for Browser React -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0?deps=react@18.2.0"
      }
    }
  </script>
  
  <!-- Babel Standalone to compile JSX in the browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  
  <!-- App Mount Point -->
  <div id="root"></div>

  <!-- React Application Logic -->
  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo, useCallback, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import { 
      Search, Plus, TrendingUp, TrendingDown, RefreshCw, 
      Trash2, X, Download, Upload, Star, Clock, 
      Settings as SettingsIcon, LayoutDashboard, Wallet,
      ChevronRight, Activity, AlertCircle, CheckCircle2,
      User, Image as ImageIcon, Box, Heart, Bell, Check, Edit3, ExternalLink,
      ShieldCheck, PieChart, Sparkles, Layers, ArrowUpRight, ArrowDownRight
    } from 'lucide-react';

    // ==========================================
    // CACHE & STORAGE
    // ==========================================

    const apiCache = {
      store: new Map(),
      set(key, data, ttlSeconds = 60) {
        this.store.set(key, { data, expiry: Date.now() + ttlSeconds * 1000 });
      },
      get(key) {
        const item = this.store.get(key);
        if (!item) return null;
        if (Date.now() > item.expiry) {
          this.store.delete(key);
          return null;
        }
        return item.data;
      }
    };

    const formatRobux = (value, format = 'suffix') => {
      const num = Math.round(Number(value) || 0);
      const formatted = new Intl.NumberFormat('en-US').format(num);
      return format === 'suffix' ? `${formatted} R$` : `R$ ${formatted}`;
    };

    const normalizeItem = (item) => ({
      id: String(item.id || Date.now()),
      assetId: String(item.assetId || ''),
      name: String(item.name || 'Unknown Item'),
      imageUrl: String(item.imageUrl || ''),
      assetType: String(item.assetType || 'Asset'),
      isLimited: Boolean(item.isLimited),
      isLimitedUnique: Boolean(item.isLimitedUnique),
      saleStatus: String(item.saleStatus || 'Available'),
      rap: Math.max(0, Number(item.rap) || 0),
      currentPrice: Math.max(0, Number(item.currentPrice) || 0),
      lowestResellerPrice: Math.max(0, Number(item.lowestResellerPrice) || 0),
      boughtPrice: Math.max(0, Number(item.boughtPrice) || 0),
      quantity: Math.max(1, Number(item.quantity) || 1),
      isFavorite: Boolean(item.isFavorite),
      history: Array.isArray(item.history) ? item.history : [],
      resellers: Array.isArray(item.resellers) ? item.resellers : [],
      dateBought: item.dateBought || new Date().toISOString(),
      lastUpdated: item.lastUpdated || new Date().toISOString()
    });

    const normalizeWishlistItem = (item) => ({
      id: String(item.id || Date.now()),
      assetId: String(item.assetId || ''),
      name: String(item.name || 'Unknown Item'),
      imageUrl: String(item.imageUrl || ''),
      currentPrice: Math.max(0, Number(item.currentPrice) || 0),
      targetPrice: Math.max(0, Number(item.targetPrice) || 0),
      availableRobux: Math.max(0, Number(item.availableRobux) || 0),
      isAffordable: Boolean(item.isAffordable),
      viewed: Boolean(item.viewed),
      createdAt: item.createdAt || new Date().toISOString()
    });

    const normalizeSettings = (settings) => ({
      autoRefresh: settings?.autoRefresh !== undefined ? Boolean(settings.autoRefresh) : true,
      refreshInterval: Number(settings?.refreshInterval) || 60,
      currencyFormat: settings?.currencyFormat === 'prefix' ? 'prefix' : 'suffix',
      theme: 'dark',
      profile: {
        username: String(settings?.profile?.username || ''),
        userId: String(settings?.profile?.userId || ''),
        displayName: String(settings?.profile?.displayName || ''),
        avatarUrl: String(settings?.profile?.avatarUrl || ''),
        customImage: String(settings?.profile?.customImage || ''),
        customAssetId: String(settings?.profile?.customAssetId || '')
      }
    });

    const storage = {
      getItems: () => {
        try {
          const data = localStorage.getItem('raply_ultimate_items');
          return data ? JSON.parse(data).map(normalizeItem) : [];
        } catch (e) { return []; }
      },
      saveItems: (items) => {
        try { localStorage.setItem('raply_ultimate_items', JSON.stringify(items)); } catch (e) {}
      },
      getWishlist: () => {
        try {
          const data = localStorage.getItem('raply_ultimate_wishlist');
          return data ? JSON.parse(data).map(normalizeWishlistItem) : [];
        } catch (e) { return []; }
      },
      saveWishlist: (wishlist) => {
        try { localStorage.setItem('raply_ultimate_wishlist', JSON.stringify(wishlist)); } catch (e) {}
      },
      getNotifications: () => {
        try {
          const data = localStorage.getItem('raply_ultimate_notifications');
          return data ? JSON.parse(data) : [];
        } catch (e) { return []; }
      },
      saveNotifications: (notes) => {
        try { localStorage.setItem('raply_ultimate_notifications', JSON.stringify(notes)); } catch (e) {}
      },
      getSettings: () => {
        try {
          const data = localStorage.getItem('raply_ultimate_settings');
          return normalizeSettings(data ? JSON.parse(data) : {});
        } catch (e) { return normalizeSettings({}); }
      },
      saveSettings: (settings) => {
        try { localStorage.setItem('raply_ultimate_settings', JSON.stringify(normalizeSettings(settings))); } catch (e) {}
      }
    };

    // ==========================================
    // ROBLOX API LAYER
    // ==========================================

    const RobloxAPI = {
      endpoints: {
        info: (id) => `https://economy.roproxy.com/v2/assets/${id}/details`,
        resale: (id) => `https://economy.roproxy.com/v1/assets/${id}/resale-data`,
        resellers: (id) => `https://economy.roproxy.com/v1/assets/${id}/resellers?limit=10`,
        ugcResale: (colId) => `https://apis.roproxy.com/marketplace-sales/v1/item/${colId}/resale-data`,
        ugcResellers: (colId) => `https://apis.roproxy.com/marketplace-sales/v1/item/${colId}/resellers?limit=10`,
        thumbnail: (id) => `https://thumbnails.roproxy.com/v1/assets?assetIds=${id}&returnPolicy=PlaceHolder&size=150x150&format=Png&isCircular=false`,
        userSearch: (username) => `https://users.roproxy.com/v1/users/search?keyword=${encodeURIComponent(username)}&limit=10`,
        userInfo: (userId) => `https://users.roproxy.com/v1/users/${userId}`,
        userAvatar: (userId) => `https://thumbnails.roproxy.com/v1/users/avatar-headshot?userIds=${userId}&size=150x150&format=Png&isCircular=true`,
        userInventory: (userId) => `https://inventory.roproxy.com/v1/users/${userId}/assets/collectibles?limit=100`
      },

      extractId(input) {
        if (!input) return null;
        const match = String(input).match(/(\d+)/);
        return match ? match[1] : null;
      },

      async getAssetThumbnail(assetId) {
        const cacheKey = `thumb_${assetId}`;
        const cached = apiCache.get(cacheKey);
        if (cached) return cached;

        try {
          const res = await fetch(this.endpoints.thumbnail(assetId));
          if (!res.ok) return '';
          const data = await res.json();
          const url = data.data?.[0]?.imageUrl || '';
          if (url) apiCache.set(cacheKey, url, 300);
          return url;
        } catch (e) {
          return '';
        }
      },

      async getAsset(assetId) {
        const cacheKey = `asset_${assetId}`;
        const cached = apiCache.get(cacheKey);
        if (cached) return cached;

        const res = await fetch(this.endpoints.info(assetId));
        if (!res.ok) throw new Error('Asset not found');
        const info = await res.json();
        
        const collectibleItemId = info.CollectibleItemId || info.collectibleItemId;
        const isClassicLimited = Boolean(info.IsLimited || info.isLimited || info.IsLimitedUnique || info.isLimitedUnique);
        const isLimited = isClassicLimited || Boolean(collectibleItemId);
        const assetType = info.AssetTypeName || info.assetTypeName || 'Asset';

        let rap = 0;
        let currentPrice = Number(info.PriceInRobux || info.priceInRobux) || 0; 
        let lowestResellerPrice = 0;
        let resellers = [];

        if (isLimited) {
          if (collectibleItemId) {
            try {
              const resaleRes = await fetch(this.endpoints.ugcResale(collectibleItemId));
              if (resaleRes.ok) {
                const resaleData = await resaleRes.json();
                rap = Number(resaleData.recentAveragePrice || resaleData.RecentAveragePrice) || 0;
                currentPrice = rap || currentPrice;
              }
            } catch (e) {}

            try {
              const resellersRes = await fetch(this.endpoints.ugcResellers(collectibleItemId));
              if (resellersRes.ok) {
                const resellersData = await resellersRes.json();
                if (resellersData.data && resellersData.data.length > 0) {
                  resellers = resellersData.data.map(r => ({
                    price: Number(r.price) || 0,
                    sellerName: r.seller?.name || r.sellerName || 'Roblox User',
                    sellerId: r.seller?.id || r.sellerId || 0,
                    quantity: 1
                  }));
                  lowestResellerPrice = Math.min(...resellers.map(r => r.price));
                  if (lowestResellerPrice > 0) currentPrice = lowestResellerPrice;
                }
              }
            } catch (e) {}
          } else {
            try {
              const resaleRes = await fetch(this.endpoints.resale(assetId));
              if (resaleRes.ok) {
                const resaleData = await resaleRes.json();
                rap = Number(resaleData.recentAveragePrice || resaleData.RecentAveragePrice) || 0;
                currentPrice = rap || currentPrice;
              }
            } catch (e) {}

            try {
              const resellersRes = await fetch(this.endpoints.resellers(assetId));
              if (resellersRes.ok) {
                const resellersData = await resellersRes.json();
                if (resellersData.data && resellersData.data.length > 0) {
                  resellers = resellersData.data.map(r => ({
                    price: Number(r.price) || 0,
                    sellerName: r.seller?.name || r.sellerName || 'Roblox User',
                    sellerId: r.seller?.id || r.sellerId || 0,
                    quantity: Number(r.assetStock) || 1
                  }));
                  lowestResellerPrice = Math.min(...resellers.map(r => r.price));
                  if (lowestResellerPrice > 0) currentPrice = lowestResellerPrice;
                }
              }
            } catch (e) {}
          }
        }

        const imageUrl = await this.getAssetThumbnail(assetId);

        const result = {
          assetId: String(assetId),
          name: info.Name || info.name || `Asset #${assetId}`,
          imageUrl,
          assetType: String(assetType),
          isLimited,
          isLimitedUnique: Boolean(info.IsLimitedUnique || info.isLimitedUnique),
          rap,
          currentPrice: currentPrice || rap || 100, 
          lowestResellerPrice,
          resellers
        };

        apiCache.set(cacheKey, result, 60);
        return result;
      },

      async getUser(usernameOrId) {
        const queryStr = String(usernameOrId).trim();
        let userId = '';
        let username = '';
        let displayName = '';

        if (/^\d+$/.test(queryStr)) {
          userId = queryStr;
          const infoRes = await fetch(this.endpoints.userInfo(userId));
          if (!infoRes.ok) throw new Error('User not found');
          const info = await infoRes.json();
          username = info.name;
          displayName = info.displayName || info.name;
        } else {
          const cleanName = queryStr.startsWith('@') ? queryStr.substring(1) : queryStr;
          const searchRes = await fetch(this.endpoints.userSearch(cleanName));
          if (!searchRes.ok) throw new Error('Failed to search user');
          const searchData = await searchRes.json();
          const match = searchData.data?.find(u => u.name.toLowerCase() === cleanName.toLowerCase());
          if (!match) throw new Error('User not found');
          userId = String(match.id);
          username = match.name;
          displayName = match.displayName || match.name;
        }

        let avatarUrl = '';
        try {
          const avatarRes = await fetch(this.endpoints.userAvatar(userId));
          if (avatarRes.ok) {
            const avatarData = await avatarRes.json();
            avatarUrl = avatarData.data?.[0]?.imageUrl || '';
          }
        } catch (e) {}

        return { userId, username, displayName, avatarUrl };
      },

      async fetchUserInventory(userId) {
        try {
          const res = await fetch(this.endpoints.userInventory(userId));
          if (!res.ok) throw new Error('Failed to fetch inventory');
          const data = await res.json();
          if (!data.data) return [];
          
          const itemsMap = new Map();
          for (const raw of data.data) {
            const assetId = String(raw.assetId || raw.formattedAssetId || '');
            if (!assetId) continue;
            
            if (itemsMap.has(assetId)) {
              const item = itemsMap.get(assetId);
              item.quantity += 1;
            } else {
              itemsMap.set(assetId, {
                assetId,
                name: raw.name || `Asset #${assetId}`,
                rap: Number(raw.recentAveragePrice) || 0,
                currentPrice: Number(raw.recentAveragePrice) || 100,
                boughtPrice: Number(raw.recentAveragePrice) || 100,
                quantity: 1,
                isLimited: true,
                isLimitedUnique: Boolean(raw.isLimitedUnique),
                imageUrl: ''
              });
            }
          }
          return Array.from(itemsMap.values());
        } catch (e) {
          throw new Error('Could not load inventory automatically (Profile might be private).');
        }
      }
    };

    // ==========================================
    // UI COMPONENTS
    // ==========================================

    const AnimatedNumber = ({ value, formatFn, className }) => {
      const [displayValue, setDisplayValue] = useState(value);
      
      useEffect(() => {
        if (displayValue === value) return;
        const duration = 500;
        const start = displayValue;
        const end = value;
        const startTime = performance.now();
        
        let animationFrame;
        const animate = (currentTime) => {
          const elapsed = currentTime - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const ease = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
          setDisplayValue(start + (end - start) * ease);
          if (progress < 1) animationFrame = requestAnimationFrame(animate);
          else setDisplayValue(end);
        };
        animationFrame = requestAnimationFrame(animate);
        return () => cancelAnimationFrame(animationFrame);
      }, [value]);

      return <span className={className}>{formatFn(displayValue)}</span>;
    };

    const RobloxImage = ({ src, alt, className, type = 'asset' }) => {
      const [hasError, setHasError] = useState(false);
      const [isLoaded, setIsLoaded] = useState(false);

      useEffect(() => { setHasError(false); setIsLoaded(false); }, [src]);

      return (
        <div className={`relative overflow-hidden flex items-center justify-center bg-[#050505] transition-all duration-300 ${className}`}>
          {(!isLoaded && !hasError) && <div className="absolute inset-0 bg-[#111111] animate-pulse" />}
          {hasError || !src ? (
            type === 'user' ? <User className="w-1/2 h-1/2 text-[#2A2A2A]" /> : <Box className="w-1/2 h-1/2 text-[#2A2A2A]" />
          ) : (
            <img 
              src={src} alt={alt || ''}
              onLoad={() => setIsLoaded(true)}
              onError={() => setHasError(true)}
              className={`w-full h-full object-contain transition-opacity duration-500 ease-out ${isLoaded ? 'opacity-100' : 'opacity-0'}`} 
              loading="lazy"
            />
          )}
        </div>
      );
    };

    const SmoothSparkline = ({ data, isPositive }) => {
      if (!data || data.length < 2) return <div className="h-full w-full flex items-center justify-center text-[#8A8A8A] text-xs font-medium">Price history unavailable</div>;
      
      const min = Math.min(...data);
      const max = Math.max(...data);
      const range = max - min || 1;
      const padding = 10;
      
      const points = data.map((val, i) => {
        const x = (i / (data.length - 1)) * 100;
        const y = 100 - padding - ((val - min) / range) * (100 - padding * 2);
        return { x, y };
      });

      const pathD = points.reduce((acc, point, i, a) => {
        if (i === 0) return `M ${point.x},${point.y}`;
        const prev = a[i - 1];
        const cp1x = prev.x + (point.x - prev.x) / 2;
        const cp2x = prev.x + (point.x - prev.x) / 2;
        return `${acc} C ${cp1x},${prev.y} ${cp2x},${point.y} ${point.x},${point.y}`;
      }, '');

      const color = isPositive ? '#30D158' : '#FF453A';

      return (
        <svg className="w-full h-full overflow-visible animate-in fade-in duration-700" viewBox="0 0 100 100" preserveAspectRatio="none">
          <defs>
            <linearGradient id={`grad-${isPositive ? 'pos' : 'neg'}`} x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stopColor={color} stopOpacity="0.25" />
              <stop offset="100%" stopColor={color} stopOpacity="0" />
            </linearGradient>
          </defs>
          <path d={`${pathD} L 100,100 L 0,100 Z`} fill={`url(#grad-${isPositive ? 'pos' : 'neg'})`} />
          <path d={pathD} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="opacity-95 drop-shadow-md" />
        </svg>
      );
    };

    const Modal = ({ isOpen, onClose, title, children, maxWidth = 'max-w-md' }) => {
      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-end md:items-center justify-center p-0 md:p-4">
          <div 
            className="absolute inset-0 bg-black/75 backdrop-blur-md animate-in fade-in duration-300 ease-out" 
            onClick={onClose} 
          />
          <div className={`relative bg-[#0A0A0A] md:border md:border-[#1A1A1A] w-full ${maxWidth} max-h-[90vh] rounded-t-[32px] md:rounded-3xl flex flex-col shadow-2xl
            animate-in slide-in-from-bottom-full md:slide-in-from-bottom-12 md:zoom-in-95 duration-400 ease-out overflow-hidden`}>
            
            <div className="md:hidden w-full flex justify-center pt-4 pb-2" onClick={onClose}>
              <div className="w-12 h-1.5 bg-[#2A2A2A] rounded-full" />
            </div>

            <div className="flex justify-between items-center px-6 py-5 border-b border-[#1A1A1A]">
              <h3 className="text-xl font-bold text-[#F5F5F5] tracking-tight">{title}</h3>
              <button onClick={onClose} className="p-2 -mr-2 text-[#8A8A8A] hover:text-[#F5F5F5] transition-colors rounded-full hover:bg-[#111111] hover:scale-105 active:scale-95">
                <X className="w-5 h-5" />
              </button>
            </div>
            
            <div className="p-6 overflow-y-auto custom-scrollbar">
              {children}
            </div>
          </div>
        </div>
      );
    };


    // ==========================================
    // MAIN APP COMPONENT
    // ==========================================

    function App() {
      const [items, setItems] = useState([]);
      const [wishlist, setWishlist] = useState([]);
      const [notifications, setNotifications] = useState([]);
      const [settings, setSettings] = useState(normalizeSettings({}));
      const [activeTab, setActiveTab] = useState('home');
      const [isOnline, setIsOnline] = useState(navigator.onLine);
      const [lastUpdate, setLastUpdate] = useState(Date.now());
      const [apiStatus, setApiStatus] = useState('Connected'); 
      const [isSyncingInventory, setIsSyncingInventory] = useState(false);
      
      const [isAddOpen, setIsAddOpen] = useState(false);
      const [isWishlistAddOpen, setIsWishlistAddOpen] = useState(false);
      const [isSearchOpen, setIsSearchOpen] = useState(false);
      const [selectedItem, setSelectedItem] = useState(null);
      const [selectedWishlistItem, setSelectedWishlistItem] = useState(null);
      const [toasts, setToasts] = useState([]);
      const [isUpdating, setIsUpdating] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');

      // Initialization
      useEffect(() => {
        setItems(storage.getItems());
        setWishlist(storage.getWishlist());
        setNotifications(storage.getNotifications());
        setSettings(storage.getSettings());

        const handleOnline = () => { setIsOnline(true); setApiStatus('Connected'); };
        const handleOffline = () => { setIsOnline(false); setApiStatus('Offline'); };
        window.addEventListener('online', handleOnline);
        window.addEventListener('offline', handleOffline);
        return () => {
          window.removeEventListener('online', handleOnline);
          window.removeEventListener('offline', handleOffline);
        };
      }, []);

      useEffect(() => { storage.saveItems(items); }, [items]);
      useEffect(() => { storage.saveWishlist(wishlist); }, [wishlist]);
      useEffect(() => { storage.saveNotifications(notifications); }, [notifications]);
      useEffect(() => { storage.saveSettings(settings); }, [settings]);

      // Wishlist Price Alerts
      useEffect(() => {
        if (wishlist.length === 0) return;
        let updated = false;
        const newWishlist = wishlist.map(w => {
          const isAffordable = w.currentPrice <= w.availableRobux;
          if (isAffordable && !w.isAffordable) {
            updated = true;
            const noteMsg = `Price Alert: ${w.name} is now within budget (${formatRobux(w.currentPrice, settings.currencyFormat)})!`;
            setNotifications(prev => [{ id: Date.now() + Math.random(), message: noteMsg, viewed: false, time: new Date().toISOString() }, ...prev]);
            showToast(`Price Alert: ${w.name} is affordable!`, 'success');
          }
          return { ...w, isAffordable };
        });
        if (updated) setWishlist(newWishlist);
      }, [items, wishlist, settings.currencyFormat]);

      const showToast = useCallback((message, type = 'success') => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3500);
      }, []);

      // Hotkeys
      useEffect(() => {
        const handleKeyDown = (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
            e.preventDefault();
            setIsSearchOpen(true);
          }
          if (e.key === 'Escape') {
            setIsSearchOpen(false); setIsAddOpen(false); setIsWishlistAddOpen(false); setSelectedItem(null); setSelectedWishlistItem(null);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      // Auto-Refresh
      const refreshMarketData = useCallback(async () => {
        if ((items.length === 0 && wishlist.length === 0) || isUpdating || !isOnline) return;
        setIsUpdating(true);
        setApiStatus('Updating');
        let updatedCount = 0;
        
        try {
          const newItems = [...items];
          for (let i = 0; i < newItems.length; i++) {
            const item = newItems[i];
            try {
              const fresh = await RobloxAPI.getAsset(item.assetId);
              if (fresh.currentPrice !== item.currentPrice || fresh.rap !== item.rap) {
                const newHistory = item.isLimited ? [...item.history, fresh.currentPrice] : [];
                if (newHistory.length > 30) newHistory.shift();
                newItems[i] = { ...item, ...fresh, history: newHistory, lastUpdated: new Date().toISOString() };
                updatedCount++;
              }
            } catch (err) {}
            await new Promise(r => setTimeout(r, 150));
          }
          setItems(newItems);

          const newWish = [...wishlist];
          for (let i = 0; i < newWish.length; i++) {
            const w = newWish[i];
            try {
              const fresh = await RobloxAPI.getAsset(w.assetId);
              if (fresh.currentPrice !== w.currentPrice) {
                newWish[i] = { ...w, currentPrice: fresh.currentPrice, lastChecked: new Date().toISOString() };
                updatedCount++;
              }
            } catch (err) {}
            await new Promise(r => setTimeout(r, 150));
          }
          setWishlist(newWish);

          if (updatedCount > 0) setLastUpdate(Date.now());
          setApiStatus('Connected');
        } catch (e) {
          setApiStatus('API Unavailable');
        } finally {
          setIsUpdating(false);
        }

        let interval;

                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (event) => {
                      try {
                        const data = JSON.parse(event.target.result);
                        if (data.items) setItems(data.items.map(normalizeItem));

          </Modal>

      const AddModal = () => {
        const [idInput, setIdInput] = useState('');
        const [loading, setLoading] = useState(false);
        const [preview, setPreview] = useState(null);
        const [error, setError] = useState('');
        const [form, setForm] = useState({ boughtPrice: '', quantity: '1' });

        useEffect(() => { if(!isAddOpen) { setIdInput(''); setPreview(null); setError(''); } }, [isAddOpen]);

        const handleSearch = async (e) => {
          e.preventDefault();
          const parsedId = RobloxAPI.extractId(idInput);
          
          if (!parsedId) {
            setError("Please enter a valid Roblox URL or Asset ID.");
            return;
          }

          setLoading(true); setError(''); setPreview(null);
          try {
            const data = await RobloxAPI.getAsset(parsedId);
            setPreview(data);
            setForm({ boughtPrice: String(data.currentPrice || 0), quantity: '1' });
          } catch (err) {
            setError("Could not fetch item. It may not exist or the proxy is busy.");
          } finally { setLoading(false); }
        };

        const handleAdd = () => {
          if (!preview) return;
          const parsedBoughtPrice = Number(form.boughtPrice) || 0;
          
          const newItem = normalizeItem({
            ...preview,
            id: Date.now().toString(),
            boughtPrice: parsedBoughtPrice,
            quantity: Number(form.quantity) || 1,
            history: preview.isLimited ? [parsedBoughtPrice, preview.currentPrice] : []
          });
          
          setItems(prev => [...prev, newItem]);
          showToast("Asset securely added to portfolio");
          setIsAddOpen(false);
        };

        return (
          <Modal isOpen={isAddOpen} onClose={() => setIsAddOpen(false)} title="Add Asset Manually">
            {!preview ? (
              <form onSubmit={handleSearch} className="space-y-5 animate-in fade-in duration-300">
                <div>
                  <label className="block text-xs font-black text-[#8A8A8A] mb-2 uppercase tracking-wider">Asset URL or ID</label>
                  <input type="text" value={idInput} onChange={e => setIdInput(e.target.value)} placeholder="e.g. 19027209 or paste catalog link..." className="w-full bg-[#111111] border border-[#1A1A1A] text-[#F5F5F5] rounded-xl px-4 py-4 font-bold focus:outline-none focus:border-[#F5F5F5] transition-colors" />
                </div>
                {error && <div className="p-3 bg-[#FF453A]/10 text-[#FF453A] rounded-xl text-xs font-bold animate-in slide-in-from-top-2">{error}</div>}

                  {loading ? <RefreshCw className="w-5 h-5 animate-spin" /> : <><Search className="w-5 h-5" /> Inspect Asset</>}
                </button>

              <div className="space-y-6 animate-in slide-in-from-right-8 fade-in duration-400 ease-out">

                  <RobloxImage src={preview.imageUrl} className="w-14 h-14 rounded-xl bg-[#050505] border border-[#1A1A1A]" />
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-2 mb-1">
                      <p className="text-sm font-black text-[#F5F5F5] truncate">{preview.name}</p>
                      {preview.isLimited ? (
                        <span className="text-[9px] font-black bg-[#30D158]/10 text-[#30D158] px-1.5 py-0.5 rounded shadow-sm">LIMITED</span>
                      ) : (
                        <span className="text-[9px] font-bold bg-[#1A1A1A] text-[#8A8A8A] px-1.5 py-0.5 rounded">STANDARD</span>
                      )}
                    </div>
                    <p className="text-xs text-[#8A8A8A] font-semibold">Market Value: <span className="text-[#F5F5F5] font-black">{formatRobux(preview.currentPrice, settings.currencyFormat)}</span></p>

                  <button onClick={() => setPreview(null)} className="p-2 text-[#8A8A8A] hover:text-[#F5F5F5] hover:bg-[#1A1A1A] rounded-full transition-all active:scale-90"><X className="w-5 h-5"/></button>
                </div>
                
                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-black text-[#8A8A8A] mb-2 uppercase tracking-wider">Purchase Price</label>

                  Confirm Addition
                </button>
              </div>
            )}
          </Modal>
        );
      };

          setLoading(true); setError(''); setPreview(null);
          try {
            const data = await RobloxAPI.getAsset(parsedId);
            setPreview(data);
            setForm({ targetPrice: String(data.currentPrice || 1000), availableRobux: '0' });
          } catch (err) {
            setError("Could not find the requested item.");
          } finally { setLoading(false); }
        };

        const handleAdd = () => {
          if (!preview) return;
          const newWish = normalizeWishlistItem({
            id: Date.now().toString(),
            assetId: preview.assetId,
            name: preview.name,
            imageUrl: preview.imageUrl,
            currentPrice: preview.currentPrice,
            targetPrice: Number(form.targetPrice) || preview.currentPrice,
            availableRobux: Number(form.availableRobux) || 0
          });
          setWishlist(prev => [...prev, newWish]);
          showToast("Added item to Wishlist.");
          setIsWishlistAddOpen(false);
        };

        return (
          <Modal isOpen={isWishlistAddOpen} onClose={() => setIsWishlistAddOpen(false)} title="Track New Wishlist Item">
            {!preview ? (
              <form onSubmit={handleSearch} className="space-y-5 animate-in fade-in duration-300">
                <div>
                  <label className="block text-xs font-black text-[#8A8A8A] mb-2 uppercase tracking-wider">Asset URL or ID</label>
                  <input type="text" value={idInput} onChange={e => setIdInput(e.target.value)} placeholder="e.g. 19027209" className="w-full bg-[#111111] border border-[#1A1A1A] text-[#F5F5F5] rounded-xl px-4 py-4 font-bold focus:outline-none focus:border-[#F5F5F5] transition-colors" />
                </div>
                {error && <div className="p-3 bg-[#FF453A]/10 text-[#FF453A] rounded-xl text-xs font-bold animate-in slide-in-from-top-2">{error}</div>}
                <button type="submit" disabled={loading || !idInput.trim()} className="w-full bg-[#F5F5F5] text-[#050505] font-black rounded-xl py-4 hover:bg-white active:scale-[0.98] transition-all disabled:opacity-50 flex justify-center items-center gap-2 shadow-sm">
                  {loading ? <RefreshCw className="w-5 h-5 animate-spin" /> : <><Search className="w-5 h-5" /> Find Item</>}
                </button>
              </form>
            ) : (
              <div className="space-y-6 animate-in slide-in-from-right-8 fade-in duration-400 ease-out">
                <div className="flex items-center gap-4 bg-[#111111] p-4 rounded-2xl border border-[#1A1A1A]">
                  <RobloxImage src={preview.imageUrl} className="w-14 h-14 rounded-xl bg-[#050505] border border-[#1A1A1A]" />
                  <div className="flex-1 min-w-0">
                    <p className="text-sm font-black text-[#F5F5F5] truncate">{preview.name}</p>
                    <p className="text-xs text-[#8A8A8A] mt-1 font-semibold">Current: <span className="text-[#F5F5F5] font-black">{formatRobux(preview.currentPrice, settings.currencyFormat)}</span></p>
                  </div>
                  <button onClick={() => setPreview(null)} className="p-2 text-[#8A8A8A] hover:text-[#F5F5F5] hover:bg-[#1A1A1A] rounded-full transition-all active:scale-90"><X className="w-5 h-5"/></button>
                </div>
                
                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-black text-[#8A8A8A] mb-2 uppercase tracking-wider">Target Price</label>
                    <input type="number" value={form.targetPrice} onChange={e => setForm({...form, targetPrice: e.target.value})} className="w-full bg-[#111111] border border-[#1A1A1A] text-[#F5F5F5] rounded-xl px-4 py-3 font-bold focus:outline-none focus:border-[#F5F5F5] transition-colors" />
                  </div>
                  <div>
                    <label className="block text-xs font-black text-[#8A8A8A] mb-2 uppercase tracking-wider">Your Saved Robux</label>
                    <input type="number" value={form.availableRobux} onChange={e => setForm({...form, availableRobux: e.target.value})} className="w-full bg-[#111111] border border-[#1A1A1A] text-[#F5F5F5] rounded-xl px-4 py-3 font-bold focus:outline-none focus:border-[#F5F5F5] transition-colors" />
                  </div>
                </div>

                <button onClick={handleAdd} className="w-full bg-[#F5F5F5] text-[#050505] font-black rounded-xl py-4 hover:bg-white active:scale-[0.98] transition-all shadow-md">
                  Save Tracking Rules
                </button>
              </div>
            )}
          </Modal>
        );
      };

      const ItemDetailsModal = () => {
        if (!selectedItem) return null;
        
        const profit = (selectedItem.currentPrice - selectedItem.boughtPrice) * selectedItem.quantity;
        const roi = selectedItem.boughtPrice > 0 ? ((selectedItem.currentPrice - selectedItem.boughtPrice) / selectedItem.boughtPrice) * 100 : 0;
        const isProfitable = profit >= 0;
        
        const chartData = selectedItem.isLimited && selectedItem.history.length > 1 
          ? selectedItem.history 
          : [selectedItem.boughtPrice || selectedItem.currentPrice, selectedItem.currentPrice]; 

        const toggleFavorite = () => {
          setItems(prev => prev.map(i => i.id === selectedItem.id ? { ...i, isFavorite: !i.isFavorite } : i));
          setSelectedItem(prev => ({ ...prev, isFavorite: !prev.isFavorite }));
          showToast(selectedItem.isFavorite ? "Removed from favorites" : "Saved to favorites");
        };

        const handleRemove = () => {
          setItems(prev => prev.filter(i => i.id !== selectedItem.id));
          setSelectedItem(null);
          showToast("Removed from portfolio");
        };

        return (
          <Modal isOpen={!!selectedItem} onClose={() => setSelectedItem(null)} title="Asset Analysis" maxWidth="max-w-xl">
            <div className="space-y-8 animate-in fade-in duration-300">
              
              <div className="flex items-start gap-6">
                <div className="w-32 h-32 rounded-3xl bg-[#111111] border border-[#1A1A1A] p-2 flex-shrink-0 relative overflow-hidden group shadow-lg">
                  <RobloxImage src={selectedItem.imageUrl} className="w-full h-full object-contain group-hover:scale-110 transition-transform duration-700 ease-out" />
                </div>
                <div className="flex-1 min-w-0 py-1">
                  <div className="flex justify-between items-start">
                    <div className="min-w-0 pr-2">
                      <div className="flex items-center gap-2 mb-2">
                        {selectedItem.isLimited ? (
                          <span className="text-[10px] font-black bg-[#30D158]/10 text-[#30D158] px-2 py-0.5 rounded shadow-sm">LIMITED</span>
                        ) : (
                          <span className="text-[10px] font-bold bg-[#1A1A1A] text-[#8A8A8A] px-2 py-0.5 rounded">STANDARD</span>
                        )}
                      </div>
                      <h2 className="text-xl font-bold text-[#F5F5F5] leading-tight truncate">{selectedItem.name}</h2>
                    </div>
                    <button onClick={toggleFavorite} className={`p-2.5 -mt-2 -mr-2 rounded-full hover:bg-[#111111] transition-all active:scale-90 ${selectedItem.isFavorite ? 'animate-in zoom-in-95 duration-200' : ''}`}>
                      <Star className={`w-6 h-6 ${selectedItem.isFavorite ? 'text-[#F5F5F5] fill-[#F5F5F5]' : 'text-[#8A8A8A]'}`} />
                    </button>
                  </div>
                  <p className="text-[#8A8A8A] text-xs font-mono mt-1 opacity-70">ID: {selectedItem.assetId}</p>
                  
                  <div className="mt-4 flex gap-6">
                    <div>
                      <p className="text-[10px] text-[#8A8A8A] uppercase font-bold tracking-wider mb-1">Market Value</p>
                      <p className="text-lg font-black text-[#F5F5F5]">{formatRobux(selectedItem.currentPrice, settings.currencyFormat)}</p>
                    </div>
                    <div>
                      <p className="text-[10px] text-[#8A8A8A] uppercase font-bold tracking-wider mb-1">Your Stock</p>
                      <p className="text-lg font-black text-[#F5F5F5]">{selectedItem.quantity}</p>
                    </div>
                  </div>
                </div>
              </div>

              {selectedItem.isLimited ? (
                <div className="bg-[#0A0A0A] border border-[#1A1A1A] rounded-3xl p-5 transition-colors hover:border-[#2A2A2A] shadow-inner">
                  <h3 className="text-xs font-bold text-[#8A8A8A] mb-4 uppercase tracking-widest">Price History (RAP)</h3>
                  <div className="h-32 w-full">
                    <SmoothSparkline data={chartData} isPositive={isProfitable} />
                  </div>
                </div>
              ) : (
                <div className="bg-[#111111] border border-[#1A1A1A] rounded-2xl p-6 text-center">
                  <p className="text-sm font-semibold text-[#8A8A8A]">Advanced charting and resale data are exclusive for Limited items.</p>
                </div>
              )}

              {selectedItem.isLimited && (
                <div className="bg-[#0A0A0A] border border-[#1A1A1A] rounded-3xl p-5 space-y-4 shadow-inner">
                  <div className="flex justify-between items-center">
                    <h3 className="text-xs font-bold text-[#8A8A8A] uppercase tracking-widest">Active Resellers</h3>
                    <span className="text-xs text-[#F5F5F5] font-bold">Lowest: <span className="text-[#30D158]">{formatRobux(selectedItem.lowestResellerPrice || selectedItem.currentPrice, settings.currencyFormat)}</span></span>
                  </div>
                  {selectedItem.resellers && selectedItem.resellers.length > 0 ? (
                    <div className="space-y-2.5 max-h-44 overflow-y-auto custom-scrollbar pr-2">
                      {selectedItem.resellers.map((res, i) => (
                        <div key={i} className="flex items-center justify-between p-3.5 bg-[#111111] rounded-xl border border-[#1A1A1A] text-sm hover:border-[#2A2A2A] transition-colors">
                          <div>
                            <p className="font-bold text-[#F5F5F5]">{res.sellerName}</p>
                            <p className="text-[10px] font-medium text-[#8A8A8A] mt-0.5">Quantity: {res.quantity}</p>
                          </div>
                          <div className="text-right">
                            <p className="font-bold text-[#F5F5F5]">{formatRobux(res.price, settings.currencyFormat)}</p>
                          </div>
                        </div>
                      ))}
                    </div>
                  ) : (
                    <p className="text-xs font-semibold text-[#8A8A8A] py-3 text-center">API indicates no active resellers at this moment.</p>
                  )}
                </div>
              )}

              <div className="grid grid-cols-2 gap-4">
                 <div className="bg-[#111111] p-5 rounded-2xl border border-[#1A1A1A] flex flex-col justify-center">
                   <p className="text-[10px] text-[#8A8A8A] uppercase font-bold tracking-wider mb-1.5">Avg Entry Cost</p>
                   <p className="text-base font-bold text-[#F5F5F5]">{formatRobux(selectedItem.boughtPrice, settings.currencyFormat)}</p>
                </div>
                <div className="bg-[#111111] p-5 rounded-2xl border border-[#1A1A1A] flex flex-col justify-center">
                   <p className="text-[10px] text-[#8A8A8A] uppercase font-bold tracking-wider mb-1.5">Net Profit / Loss</p>
                   <p className={`text-base font-black flex items-center gap-2 ${isProfitable ? 'text-[#30D158]' : 'text-[#FF453A]'}`}>
                     {profit > 0 ? '+' : ''}{formatRobux(profit, settings.currencyFormat)}
                     <span className="text-xs opacity-80 font-bold bg-black/20 px-2 py-0.5 rounded">({roi > 0 ? '+' : ''}{roi.toFixed(1)}%)</span>
                   </p>
                </div>
              </div>

              <div className="pt-2">
                <button onClick={handleRemove} className="w-full py-4 bg-[#FF453A]/10 text-[#FF453A] hover:bg-[#FF453A]/20 active:scale-[0.98] rounded-xl text-sm font-bold transition-all border border-transparent hover:border-[#FF453A]/30">
                  Remove Asset from Portfolio
                </button>
              </div>

            </div>
          </Modal>
        );
      };

      const WishlistDetailsModal = () => {
        if (!selectedWishlistItem) return null;

        const handleRemove = () => {
          setWishlist(prev => prev.filter(w => w.id !== selectedWishlistItem.id));
          setSelectedWishlistItem(null);
          showToast("Successfully stopped tracking item.");
        };

        return (
          <Modal isOpen={!!selectedWishlistItem} onClose={() => setSelectedWishlistItem(null)} title="Tracking Insights" maxWidth="max-w-lg">
            <div className="space-y-8 animate-in fade-in duration-300">
              <div className="flex items-center gap-5">
                <RobloxImage src={selectedWishlistItem.imageUrl} className="w-24 h-24 rounded-3xl bg-[#111111] border border-[#1A1A1A] p-2 shadow-lg" />
                <div className="flex-1 min-w-0">
                  <h2 className="text-xl font-bold text-[#F5F5F5] truncate">{selectedWishlistItem.name}</h2>
                  <p className="text-sm font-semibold text-[#8A8A8A] mt-1.5">Market Value: <strong className="text-[#F5F5F5]">{formatRobux(selectedWishlistItem.currentPrice, settings.currencyFormat)}</strong></p>
                  {selectedWishlistItem.isAffordable && (
                    <span className="inline-block mt-3 text-[10px] font-black text-[#30D158] bg-[#30D158]/10 px-2.5 py-1 rounded shadow-sm">AFFORDABLE NOW</span>
                  )}
                </div>
              </div>

              <div className="bg-[#111111] p-5 rounded-3xl border border-[#1A1A1A] space-y-4 shadow-inner">
                <div className="flex justify-between items-center text-sm">
                  <span className="text-[#8A8A8A] font-semibold">Your Target Price</span>
                  <span className="text-[#F5F5F5] font-black">{formatRobux(selectedWishlistItem.targetPrice, settings.currencyFormat)}</span>
                </div>
                <div className="flex justify-between items-center text-sm">
                  <span className="text-[#8A8A8A] font-semibold">Your Current Robux</span>
                  <span className="text-[#F5F5F5] font-black">{formatRobux(selectedWishlistItem.availableRobux, settings.currencyFormat)}</span>
                </div>
                <div className="flex justify-between items-center text-sm pt-4 border-t border-[#1A1A1A]">
                  <span className="text-[#8A8A8A] font-black uppercase tracking-wider text-xs">Differential</span>
                  <span className={`font-black text-base ${selectedWishlistItem.availableRobux >= selectedWishlistItem.targetPrice ? 'text-[#30D158]' : 'text-[#FF453A]'}`}>
                    {formatRobux(Math.abs(selectedWishlistItem.targetPrice - selectedWishlistItem.availableRobux), settings.currencyFormat)} {selectedWishlistItem.availableRobux >= selectedWishlistItem.targetPrice ? 'Surplus' : 'Deficit'}
                  </span>
                </div>
              </div>

              <button onClick={handleRemove} className="w-full py-4 bg-[#FF453A]/10 text-[#FF453A] hover:bg-[#FF453A]/20 active:scale-[0.98] rounded-xl text-sm font-bold transition-all">
                Stop Tracking
              </button>
            </div>
          </Modal>
        );
      };

      // Sidebar / Bottom Nav
      const NavItem = ({ id, icon, label, isMobile, badge }) => {
        const isActive = activeTab === id;
        if (isMobile) {
          return (
            <button onClick={() => setActiveTab(id)} className={`flex flex-col items-center justify-center w-full h-full gap-1 transition-all duration-300 relative ${isActive ? 'text-[#F5F5F5]' : 'text-[#8A8A8A] hover:text-[#D1D1D1]'}`}>
              {isActive && <div className="absolute top-1 w-1.5 h-1.5 bg-[#F5F5F5] rounded-full animate-in zoom-in-95" />}
              {badge > 0 && <span className="absolute top-1 right-1/3 w-4 h-4 bg-[#FF453A] text-white text-[9px] font-bold rounded-full flex items-center justify-center border border-[#0A0A0A]">{badge}</span>}
              {React.cloneElement(icon, { className: `w-5 h-5 transition-transform duration-300 ${isActive ? 'scale-110' : 'scale-100'}` })}
              <span className={`text-[10px] font-bold transition-all duration-300 ${isActive ? 'opacity-100' : 'opacity-70'}`}>{label}</span>
            </button>
          );
        }
        return (
          <button onClick={() => setActiveTab(id)} className={`w-full flex items-center justify-between px-5 py-3.5 rounded-2xl transition-all duration-200 group ${isActive ? 'bg-[#111111] text-[#F5F5F5] font-black shadow-sm' : 'text-[#8A8A8A] font-bold hover:text-[#F5F5F5] hover:bg-[#0A0A0A] active:scale-95'}`}>
            <div className="flex items-center gap-4">
              {React.cloneElement(icon, { className: `w-5 h-5 transition-transform duration-200 ${isActive ? 'scale-110 text-[#F5F5F5]' : 'group-hover:scale-110'}` })}
              <span className="text-sm">{label}</span>
            </div>
            {badge > 0 && <span className="bg-[#FF453A] text-white text-[10px] font-bold px-2 py-0.5 rounded-full">{badge}</span>}
          </button>
        );
      };

      return (
        <div className="flex h-[100dvh] w-full bg-[#050505] text-[#F5F5F5] font-sans selection:bg-[#30D158]/35 selection:text-[#F5F5F5] overflow-hidden">
          
          {/* Sidebar - Desktop */}
          <aside className="hidden md:flex flex-col w-72 bg-[#050505] border-r border-[#1A1A1A] z-40 relative">
            <div className="h-24 flex items-center justify-between px-8">
              <div>
                <h1 className="text-2xl font-black tracking-[0.2em] text-[#F5F5F5]">RAPLY</h1>
                <p className="text-[10px] text-purple-400 font-bold tracking-widest uppercase">By Pan • Ultimate</p>
              </div>
              {unreadNotesCount > 0 && (
                <span className="bg-[#FF453A] text-white text-xs font-bold px-2.5 py-0.5 rounded-full animate-pulse">{unreadNotesCount} alert</span>
              )}
            </div>
            <nav className="flex-1 space-y-1.5 px-5">
              <NavItem id="home" icon={<LayoutDashboard />} label="Dashboard" />
              <NavItem id="portfolio" icon={<Wallet />} label="Portfolio" />
              <NavItem id="wishlist" icon={<Heart />} label="Wishlist" badge={wishlist.filter(w => w.isAffordable).length} />
              <NavItem id="favorites" icon={<Star />} label="Favorites" />
              <NavItem id="settings" icon={<SettingsIcon />} label="Settings" />
            </nav>
            
            {/* User Profile Snippet */}
            <div className="px-5 pb-3 pt-6">
              <button onClick={() => setActiveTab('settings')} className="w-full p-3 flex items-center gap-3 hover:bg-[#0A0A0A] rounded-2xl transition-all border border-transparent hover:border-[#1A1A1A] active:scale-[0.98] text-left group">
                <RobloxImage src={profileDisplayImage} type="user" className="w-11 h-11 rounded-full border border-[#1A1A1A] bg-[#111111] group-hover:scale-105 transition-transform" />
                <div className="flex-1 min-w-0">
                  <p className="text-sm font-bold text-[#F5F5F5] truncate">{settings.profile.displayName || 'Guest User'}</p>
                  <p className="text-xs font-semibold text-[#8A8A8A] truncate mt-0.5">{settings.profile.username ? `@${settings.profile.username}` : 'Link account'}</p>
                </div>
                <ChevronRight className="w-4 h-4 text-[#8A8A8A] opacity-0 group-hover:opacity-100 transition-all group-hover:translate-x-1" />
              </button>
            </div>

            <div className="p-5 border-t border-[#1A1A1A]/50">
              <button onClick={() => setIsSearchOpen(true)} className="w-full flex items-center gap-3 px-4 py-3 bg-[#0A0A0A] hover:bg-[#111111] active:scale-[0.98] border border-[#1A1A1A] rounded-2xl text-[#8A8A8A] text-sm font-bold transition-all group">
                <Search className="w-5 h-5 transition-transform group-hover:scale-110" /> 
                <span>Search Assets</span>
                <kbd className="ml-auto hidden lg:inline-block text-[10px] bg-[#1A1A1A] px-2 py-1 rounded-md text-[#8A8A8A] group-hover:text-[#F5F5F5] border border-[#2A2A2A] transition-colors">Cmd K</kbd>
              </button>
            </div>
          </aside>

          {/* Main Content */}
          <main className="flex-1 relative flex flex-col h-full overflow-hidden">
            {/* Mobile Header */}
            <div className="md:hidden flex items-center justify-between px-5 h-16 border-b border-[#1A1A1A] bg-[#050505]/80 backdrop-blur-md z-30">
              <div>
                <h1 className="text-lg font-black tracking-[0.2em] text-[#F5F5F5]">RAPLY</h1>
              </div>
              <div className="flex items-center gap-3">
                <button onClick={() => setIsSearchOpen(true)} className="p-2 text-[#8A8A8A] hover:text-[#F5F5F5] transition-colors bg-[#111111] rounded-full">
                  <Search className="w-4 h-4" />
                </button>
              </div>
            </div>

            <div className="flex-1 overflow-y-auto custom-scrollbar p-5 md:p-10 lg:p-14 pb-28 md:pb-14">
              <div className="max-w-5xl mx-auto h-full">
                {activeTab === 'home' && renderDashboard()}
                {activeTab === 'portfolio' && renderPortfolio()}
                {activeTab === 'wishlist' && renderWishlist()}
                {activeTab === 'favorites' && renderFavorites()}
                {activeTab === 'settings' && renderSettings()}
              </div>
            </div>
          </main>

          {/* Bottom Nav - Mobile */}
          <nav className="md:hidden fixed bottom-0 inset-x-0 bg-[#050505]/95 backdrop-blur-xl border-t border-[#1A1A1A] z-40 pb-safe shadow-[0_-10px_40px_rgba(0,0,0,0.8)]">
            <div className="flex justify-around items-center h-16 px-2">
              <NavItem id="home" icon={<LayoutDashboard />} label="Home" isMobile />
              <NavItem id="portfolio" icon={<Wallet />} label="Assets" isMobile />
              <NavItem id="wishlist" icon={<Heart />} label="Wishlist" isMobile badge={wishlist.filter(w => w.isAffordable).length} />
              <NavItem id="favorites" icon={<Star />} label="Favorites" isMobile />
              <NavItem id="settings" icon={<SettingsIcon />} label="Settings" isMobile />
            </div>
          </nav>

          {/* Toasts */}
          <div className="fixed bottom-24 md:bottom-8 right-0 left-0 md:left-auto md:right-8 flex flex-col items-center md:items-end gap-3 z-[60] pointer-events-none px-5 md:px-0">
            {toasts.map(toast => (
              <div key={toast.id} className="pointer-events-auto flex items-center gap-3 bg-[#111111] border border-[#2A2A2A] text-[#F5F5F5] px-5 py-4 rounded-2xl shadow-2xl animate-in slide-in-from-bottom-4 fade-in duration-300 ease-out">
                {toast.type === 'error' ? <AlertCircle className="w-5 h-5 text-[#FF453A]" /> : <CheckCircle2 className="w-5 h-5 text-[#30D158]" />}
                <span className="text-sm font-bold">{toast.message}</span>
              </div>
            ))}
          </div>

          {/* Modals */}
          <AddModal />
          <AddWishlistModal />
          <ItemDetailsModal />
          <WishlistDetailsModal />
          <SearchModal />
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
