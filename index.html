<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Raply by Pan</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: '#030305',
            surface: 'rgba(15, 15, 22, 0.65)',
            border: 'rgba(255, 255, 255, 0.08)',
            accent: '#6366f1',
            accentGlow: 'rgba(99, 102, 241, 0.25)'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
    
    :root { 
      color-scheme: dark; 
    }
    
    body {
      background-color: #030305;
      color: #F8FAFC;
      -webkit-font-smoothing: antialiased;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(168, 85, 247, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.05) 0%, transparent 60%);
      background-attachment: fixed;
    }

    .pb-safe { padding-bottom: max(16px, env(safe-area-inset-bottom)); }
    
    /* Ultra-Smooth Scrollbars */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(255, 255, 255, 0.1); border-radius: 999px; transition: background-color 0.3s; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: rgba(255, 255, 255, 0.25); }
    
    input[type="number"]::-webkit-inner-spin-button, 
    input[type="number"]::-webkit-outer-spin-button { 
      -webkit-appearance: none; margin: 0; 
    }

    /* Glassmorphism Classes */
    .glass-card {
      background: rgba(12, 12, 20, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .glass-card-interactive {
      background: rgba(15, 15, 26, 0.55);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      transform-style: preserve-3d;
    }

    .glass-card-interactive:hover {
      background: rgba(22, 22, 38, 0.75);
      border-color: rgba(255, 255, 255, 0.18);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5), 0 0 20px 0 rgba(99, 102, 241, 0.15);
    }

    .glass-modal {
      background: rgba(8, 8, 14, 0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    /* 3D Depth Utilities */
    .preserve-3d { transform-style: preserve-3d; }
    .translate-z-10 { transform: translateZ(10px); }
    .translate-z-20 { transform: translateZ(20px); }

    /* Custom Animations */
    .animate-in {
      animation-duration: 0.5s;
      animation-fill-mode: both;
      animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .fade-in { animation-name: fadeIn; }
    .slide-in-from-bottom-4 { animation-name: slideInBottom4; }
    .slide-in-from-bottom-8 { animation-name: slideInBottom8; }
    .slide-in-from-bottom-full { animation-name: slideInBottomFull; }
    .slide-in-from-top-2 { animation-name: slideInTop2; }
    .slide-in-from-right-4 { animation-name: slideInRight4; }
    .zoom-in-95 { animation-name: zoomIn95; }
    .pulse-glow { animation: pulseGlow 3s infinite ease-in-out; }

    @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes slideInBottom4 { 0% { opacity: 0; transform: translateY(16px); } 100% { opacity: 1; transform: translateY(0); } }
    @keyframes slideInBottom8 { 0% { opacity: 0; transform: translateY(32px); } 100% { opacity: 1; transform: translateY(0); } }
    @keyframes slideInBottomFull { 0% { opacity: 0; transform: translateY(100%); } 100% { opacity: 1; transform: translateY(0); } }
    @keyframes slideInTop2 { 0% { opacity: 0; transform: translateY(-8px); } 100% { opacity: 1; transform: translateY(0); } }
    @keyframes slideInRight4 { 0% { opacity: 0; transform: translateX(16px); } 100% { opacity: 1; transform: translateX(0); } }
    @keyframes zoomIn95 { 0% { opacity: 0; transform: scale(0.95); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes pulseGlow { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.8; } }

    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js" type="module"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js" type="module"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js" type="module"></script>

  <!-- ES Module Import Map for Browser React -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0?deps=react@18.2.0",
        "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"
      }
    }
  </script>
  
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo, useCallback, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import { 
      Search, Plus, TrendingUp, TrendingDown, RefreshCw, 
      Trash2, X, Download, Upload, Star, Clock, 
      Settings as SettingsIcon, LayoutDashboard, Wallet,
      ChevronRight, Activity, AlertCircle, CheckCircle2,
      User, Box, Heart, Bell, Check, Share, Smartphone, Sparkles,
      Cloud, CloudOff, Info, ArrowUpRight, ArrowDownRight, Smartphone as PhoneIcon
    } from 'lucide-react';

    import { initializeApp } from 'firebase/app';
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'firebase/auth';
    import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot } from 'firebase/firestore';

    // ==========================================
    // FIREBASE INITIALIZATION PERSISTENCE
    // ==========================================
    const firebaseConfig = typeof __firebase_config !== 'undefined' 
      ? JSON.parse(__firebase_config)
      : {
          apiKey: "demo-key",
          authDomain: "demo.firebaseapp.com",
          projectId: "demo-project",
          storageBucket: "demo.appspot.com",
          messagingSenderId: "123456789",
          appId: "1:123456789:web:abcdef"
        };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'raply-by-pan';

    // Helper functions for normalization
    const formatRobux = (value, format = 'suffix') => {
      const num = Math.round(Number(value) || 0);
      const formatted = new Intl.NumberFormat('en-US').format(num);
      return format === 'suffix' ? `${formatted} R$` : `R$ ${formatted}`;
    };

    const normalizeItem = (item) => ({
      id: String(item.id || Date.now()),
      assetId: String(item.assetId || ''),
      name: String(item.name || 'Unknown Item'),
      imageUrl: String(item.imageUrl || ''),
      assetType: String(item.assetType || 'Asset'),
      isLimited: Boolean(item.isLimited),
      isLimitedUnique: Boolean(item.isLimitedUnique),
      saleStatus: String(item.saleStatus || 'Available'),
      rap: Math.max(0, Number(item.rap) || 0),
      currentPrice: Math.max(0, Number(item.currentPrice) || 0),
      lowestResellerPrice: Math.max(0, Number(item.lowestResellerPrice) || 0),
      boughtPrice: Math.max(0, Number(item.boughtPrice) || 0),
      quantity: Math.max(1, Number(item.quantity) || 1),
      isFavorite: Boolean(item.isFavorite),
      history: Array.isArray(item.history) ? item.history : [],
      resellers: Array.isArray(item.resellers) ? item.resellers : [],
      dateBought: item.dateBought || new Date().toISOString(),
      lastUpdated: item.lastUpdated || new Date().toISOString()
    });

    const normalizeWishlistItem = (item) => ({
      id: String(item.id || Date.now()),
      assetId: String(item.assetId || ''),
      name: String(item.name || 'Unknown Item'),
      imageUrl: String(item.imageUrl || ''),
      currentPrice: Math.max(0, Number(item.currentPrice) || 0),
      targetPrice: Math.max(0, Number(item.targetPrice) || 0),
      availableRobux: Math.max(0, Number(item.availableRobux) || 0),
      isAffordable: Boolean(item.isAffordable),
      createdAt: item.createdAt || new Date().toISOString()
    });

    const normalizeSettings = (settings) => ({
      autoRefresh: settings?.autoRefresh !== undefined ? Boolean(settings.autoRefresh) : true,
      refreshInterval: Number(settings?.refreshInterval) || 60,
      currencyFormat: settings?.currencyFormat === 'prefix' ? 'prefix' : 'suffix',
      profile: {
        username: String(settings?.profile?.username || ''),
        userId: String(settings?.profile?.userId || ''),
        displayName: String(settings?.profile?.displayName || ''),
        avatarUrl: String(settings?.profile?.avatarUrl || ''),
        customImage: String(settings?.profile?.customImage || ''),
        customAssetId: String(settings?.profile?.customAssetId || '')
      }
    });

    // Cache System
    const apiCache = {
      store: new Map(),
      set(key, data, ttlSeconds = 60) {
        this.store.set(key, { data, expiry: Date.now() + ttlSeconds * 1000 });
      },
      get(key) {
        const item = this.store.get(key);
        if (!item || Date.now() > item.expiry) return null;
        return item.data;
      }
    };

    // ==========================================
    // ROBLOX API LAYER (Enhanced Fallbacks for Public Inventory)
    // ==========================================
    const RobloxAPI = {
      endpoints: {
        info: (id) => `https://economy.roproxy.com/v2/assets/${id}/details`,
        resale: (id) => `https://economy.roproxy.com/v1/assets/${id}/resale-data`,
        resellers: (id) => `https://economy.roproxy.com/v1/assets/${id}/resellers?limit=10`,
        ugcResale: (colId) => `https://apis.roproxy.com/marketplace-sales/v1/item/${colId}/resale-data`,
        ugcResellers: (colId) => `https://apis.roproxy.com/marketplace-sales/v1/item/${colId}/resellers?limit=10`,
        thumbnail: (id) => `https://thumbnails.roproxy.com/v1/assets?assetIds=${id}&returnPolicy=PlaceHolder&size=150x150&format=Png&isCircular=false`,
        userSearch: (username) => `https://users.roproxy.com/v1/users/search?keyword=${encodeURIComponent(username)}&limit=10`,
        userInfo: (userId) => `https://users.roproxy.com/v1/users/${userId}`,
        userAvatar: (userId) => `https://thumbnails.roproxy.com/v1/users/avatar-headshot?userIds=${userId}&size=150x150&format=Png&isCircular=true`,
        userInventory: (userId) => `https://inventory.roproxy.com/v1/users/${userId}/assets/collectibles?limit=100`
      },

      extractId(input) {
        if (!input) return null;
        const match = String(input).match(/(\d+)/);
        return match ? match[1] : null;
      },

      async getAssetThumbnail(assetId) {
        const cacheKey = `thumb_${assetId}`;
        const cached = apiCache.get(cacheKey);
        if (cached) return cached;

        try {
          const res = await fetch(this.endpoints.thumbnail(assetId));
          if (!res.ok) return '';
          const data = await res.json();
          const url = data.data?.[0]?.imageUrl || '';
          if (url) apiCache.set(cacheKey, url, 300);
          return url;
        } catch (e) {
          return '';
        }
      },

      async getAsset(assetId) {
        const cacheKey = `asset_${assetId}`;
        const cached = apiCache.get(cacheKey);
        if (cached) return cached;

        const res = await fetch(this.endpoints.info(assetId));
        if (!res.ok) throw new Error('Asset not found');
        const info = await res.json();
        
        const collectibleItemId = info.CollectibleItemId || info.collectibleItemId;
        const isClassicLimited = Boolean(info.IsLimited || info.isLimited || info.IsLimitedUnique || info.isLimitedUnique);
        const isLimited = isClassicLimited || Boolean(collectibleItemId);
        const assetType = info.AssetTypeName || info.assetTypeName || 'Asset';

        let rap = 0;
        let currentPrice = Number(info.PriceInRobux || info.priceInRobux) || 0; 
        let lowestResellerPrice = 0;
        let resellers = [];

        if (isLimited) {
          if (collectibleItemId) {
            try {
              const resaleRes = await fetch(this.endpoints.ugcResale(collectibleItemId));
              if (resaleRes.ok) {
                const resaleData = await resaleRes.json();
                rap = Number(resaleData.recentAveragePrice || resaleData.RecentAveragePrice) || 0;
                currentPrice = rap || currentPrice;
              }
            } catch (e) {}

            try {
              const resellersRes = await fetch(this.endpoints.ugcResellers(collectibleItemId));
              if (resellersRes.ok) {
                const resellersData = await resellersRes.json();
                if (resellersData.data && resellersData.data.length > 0) {
                  resellers = resellersData.data.map(r => ({
                    price: Number(r.price) || 0,
                    sellerName: r.seller?.name || r.sellerName || 'Roblox User',
                    sellerId: r.seller?.id || r.sellerId || 0,
                    quantity: 1
                  }));
                  lowestResellerPrice = Math.min(...resellers.map(r => r.price));
                  if (lowestResellerPrice > 0) currentPrice = lowestResellerPrice;
                }
              }
            } catch (e) {}
          } else {
            try {
              const resaleRes = await fetch(this.endpoints.resale(assetId));
              if (resaleRes.ok) {
                const resaleData = await resaleRes.json();
                rap = Number(resaleData.recentAveragePrice || resaleData.RecentAveragePrice) || 0;
                currentPrice = rap || currentPrice;
              }
            } catch (e) {}

            try {
              const resellersRes = await fetch(this.endpoints.resellers(assetId));
              if (resellersRes.ok) {
                const resellersData = await resellersRes.json();
                if (resellersData.data && resellersData.data.length > 0) {
                  resellers = resellersData.data.map(r => ({
                    price: Number(r.price) || 0,
                    sellerName: r.seller?.name || r.sellerName || 'Roblox User',
                    sellerId: r.seller?.id || r.sellerId || 0,
                    quantity: Number(r.assetStock) || 1
                  }));
                  lowestResellerPrice = Math.min(...resellers.map(r => r.price));
                  if (lowestResellerPrice > 0) currentPrice = lowestResellerPrice;
                }
              }
            } catch (e) {}
          }
        }

        const imageUrl = await this.getAssetThumbnail(assetId);

        const result = {
          assetId: String(assetId),
          name: info.Name || info.name || `Asset #${assetId}`,
          imageUrl,
          assetType: String(assetType),
          isLimited,
          isLimitedUnique: Boolean(info.IsLimitedUnique || info.isLimitedUnique),
          rap,
          currentPrice: currentPrice || rap || 100, 
          lowestResellerPrice,
          resellers
        };

        apiCache.set(cacheKey, result, 60);
        return result;
      },

      async getUser(usernameOrId) {
        const queryStr = String(usernameOrId).trim();
        let userId = '';
        let username = '';
        let displayName = '';

        if (/^\d+$/.test(queryStr)) {
          userId = queryStr;
          const infoRes = await fetch(this.endpoints.userInfo(userId));
          if (!infoRes.ok) throw new Error('User not found');
          const info = await infoRes.json();
          username = info.name;
          displayName = info.displayName || info.name;
        } else {
          const cleanName = queryStr.startsWith('@') ? queryStr.substring(1) : queryStr;
          const searchRes = await fetch(this.endpoints.userSearch(cleanName));
          if (!searchRes.ok) throw new Error('Failed to search user');
          const searchData = await searchRes.json();
          const match = searchData.data?.find(u => u.name.toLowerCase() === cleanName.toLowerCase());
          if (!match) throw new Error('User not found');
          userId = String(match.id);
          username = match.name;
          displayName = match.displayName || match.name;
        }

        let avatarUrl = '';
        try {
          const avatarRes = await fetch(this.endpoints.userAvatar(userId));
          if (avatarRes.ok) {
            const avatarData = await avatarRes.json();
            avatarUrl = avatarData.data?.[0]?.imageUrl || '';
          }
        } catch (e) {}

        return { userId, username, displayName, avatarUrl };
      },

      async fetchUserInventory(userId) {
        try {
          const res = await fetch(this.endpoints.userInventory(userId));
          if (!res.ok) {
            if (res.status === 403) {
              throw new Error("Your Roblox Inventory privacy setting is set to Private. Please go to Roblox Settings -> Privacy -> 'Who can see my inventory?' and set it to Everyone.");
            }
            throw new Error("Failed to reach Roblox API proxy.");
          }
          const data = await res.json();
          if (!data || !data.data || data.data.length === 0) {
            return [];
          }
          
          const itemsMap = new Map();
          for (const raw of data.data) {
            const assetId = String(raw.assetId || raw.formattedAssetId || '');
            if (!assetId) continue;
            
            if (itemsMap.has(assetId)) {
              const item = itemsMap.get(assetId);
              item.quantity += 1;
            } else {
              itemsMap.set(assetId, {
                assetId,
                name: raw.name || `Asset #${assetId}`,
                rap: Number(raw.recentAveragePrice) || 0,
                currentPrice: Number(raw.recentAveragePrice) || 100,
                boughtPrice: Number(raw.recentAveragePrice) || 100,
                quantity: 1,
                isLimited: true,
                isLimitedUnique: Boolean(raw.isLimitedUnique),
                imageUrl: ''
              });
            }
          }
          return Array.from(itemsMap.values());
        } catch (e) {
          throw new Error(e.message || 'Could not load inventory automatically.');
        }
      }
    };

    // 3D Glass Card Container Component
    const GlassCard3D = ({ children, className = "", onClick }) => {
      const cardRef = useRef(null);
      const [transform, setTransform] = useState("perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)");

      const handleMouseMove = (e) => {
        if (!cardRef.current) return;
        const rect = cardRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        
        const rotateX = ((y - centerY) / centerY) * -8;
        const rotateY = ((x - centerX) / centerX) * 8;

        setTransform(`perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`);
      };

      const handleMouseLeave = () => {
        setTransform("perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)");
      };

      return (
        <div 
          ref={cardRef}
          onClick={onClick}
          onMouseMove={handleMouseMove}
          onMouseLeave={handleMouseLeave}
          style={{ transform, transition: 'transform 0.15s ease-out' }}
          className={`glass-card-interactive rounded-3xl p-6 cursor-pointer preserve-3d ${className}`}
        >
          {children}
        </div>
      );
    };

    const AnimatedNumber = ({ value, formatFn, className }) => {
      const [displayValue, setDisplayValue] = useState(value);
      
      useEffect(() => {
        if (displayValue === value) return;
        const duration = 600;
        const start = displayValue;
        const end = value;
        const startTime = performance.now();
        
        let animationFrame;
        const animate = (currentTime) => {
          const elapsed = currentTime - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const ease = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
          setDisplayValue(start + (end - start) * ease);
          if (progress < 1) animationFrame = requestAnimationFrame(animate);
          else setDisplayValue(end);
        };
        animationFrame = requestAnimationFrame(animate);
        return () => cancelAnimationFrame(animationFrame);
      }, [value]);

      return <span className={className}>{formatFn(displayValue)}</span>;
    };

    const RobloxImage = ({ src, alt, className, type = 'asset' }) => {
      const [hasError, setHasError] = useState(false);
      const [isLoaded, setIsLoaded] = useState(false);

      useEffect(() => { setHasError(false); setIsLoaded(false); }, [src]);

      return (
        <div className={`relative overflow-hidden flex items-center justify-center bg-[#080810] transition-all duration-300 ${className}`}>
          {(!isLoaded && !hasError) && <div className="absolute inset-0 bg-[#121220] animate-pulse" />}
          {hasError || !src ? (
            type === 'user' ? <User className="w-1/2 h-1/2 text-white/20" /> : <Box className="w-1/2 h-1/2 text-white/20" />
          ) : (
            <img 
              src={src} alt={alt || ''}
              onLoad={() => setIsLoaded(true)}
              onError={() => setHasError(true)}
              className={`w-full h-full object-contain transition-all duration-500 ease-out ${isLoaded ? 'opacity-100 scale-100' : 'opacity-0 scale-95'}`} 
              loading="lazy"
            />
          )}
        </div>
      );
    };

    const SmoothSparkline = ({ data, isPositive }) => {
      if (!data || data.length < 2) return <div className="h-full w-full flex items-center justify-center text-white/40 text-xs font-medium">Price history compiling...</div>;
      
      const min = Math.min(...data);
      const max = Math.max(...data);
      const range = max - min || 1;
      const padding = 10;
      
      const points = data.map((val, i) => {
        const x = (i / (data.length - 1)) * 100;
        const y = 100 - padding - ((val - min) / range) * (100 - padding * 2);
        return { x, y };
      });

      const pathD = points.reduce((acc, point, i, a) => {
        if (i === 0) return `M ${point.x},${point.y}`;
        const prev = a[i - 1];
        const cp1x = prev.x + (point.x - prev.x) / 2;
        const cp2x = prev.x + (point.x - prev.x) / 2;
        return `${acc} C ${cp1x},${prev.y} ${cp2x},${point.y} ${point.x},${point.y}`;
      }, '');

      const color = isPositive ? '#10B981' : '#EF4444';

      return (
        <svg className="w-full h-full overflow-visible animate-in fade-in duration-700" viewBox="0 0 100 100" preserveAspectRatio="none">
          <defs>
            <linearGradient id={`grad-${isPositive ? 'pos' : 'neg'}`} x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stopColor={color} stopOpacity="0.35" />
              <stop offset="100%" stopColor={color} stopOpacity="0" />
            </linearGradient>
          </defs>
          <path d={`${pathD} L 100,100 L 0,100 Z`} fill={`url(#grad-${isPositive ? 'pos' : 'neg'})`} />
          <path d={pathD} fill="none" stroke={color} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className="drop-shadow-[0_0_8px_rgba(16,185,129,0.5)]" />
        </svg>
      );

    const Modal = ({ isOpen, onClose, title, children, maxWidth = 'max-w-md' }) => {
      if (!isOpen) return null;

    // ==========================================
    // MAIN APP COMPONENT WITH FIREBASE PERSISTENCE
    // ==========================================
    export default function App() {
      const [user, setUser] = useState(null);
      const [items, setItems] = useState([]);
      const [wishlist, setWishlist] = useState([]);
      const [notifications, setNotifications] = useState([]);
      const [settings, setSettings] = useState(normalizeSettings({}));
      const [activeTab, setActiveTab] = useState('home');
      const [isOnline, setIsOnline] = useState(navigator.onLine);
      const [apiStatus, setApiStatus] = useState('Connected'); 
      const [isSyncingInventory, setIsSyncingInventory] = useState(false);
      
      const [isAddOpen, setIsAddOpen] = useState(false);
      const [isWishlistAddOpen, setIsWishlistAddOpen] = useState(false);
      const [isSearchOpen, setIsSearchOpen] = useState(false);
      const [isPwaTutorialOpen, setIsPwaTutorialOpen] = useState(false);
      const [showPwaBanner, setShowPwaBanner] = useState(false);
      const [selectedItem, setSelectedItem] = useState(null);
      const [selectedWishlistItem, setSelectedWishlistItem] = useState(null);
      const [toasts, setToasts] = useState([]);
      const [isUpdating, setIsUpdating] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');

      // (1) Firebase Auth initialization
      useEffect(() => {
        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (e) {
            console.error("Auth init error:", e);
          }
        };
        initAuth();
        const unsubscribe = onAuthStateChanged(auth, setUser);
        return () => unsubscribe();
      }, []);

      // (2) Firestore Realtime Subscription (Data Persists Across App Updates)
      useEffect(() => {
        if (!user) return;

        const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'userData', 'mainDoc');

        const unsubscribe = onSnapshot(docRef, (docSnap) => {
          if (docSnap.exists()) {
            const data = docSnap.data();
            if (data.items) setItems(data.items.map(normalizeItem));
            if (data.wishlist) setWishlist(data.wishlist.map(normalizeWishlistItem));
            if (data.notifications) setNotifications(data.notifications);
            if (data.settings) setSettings(normalizeSettings(data.settings));
          } else {
            // Push current local default state to firestore if first load
            setDoc(docRef, {
              items: [],
              wishlist: [],
              notifications: [],
              settings: normalizeSettings({})
            }).catch(err => console.error(err));
          }
        }, (err) => {
          console.error("Firestore sync error:", err);
        });

        return () => unsubscribe();
      }, [user]);

      // Save helper to push to Firestore
      const persistDataToCloud = useCallback(async (updatedItems, updatedWishlist, updatedNotifications, updatedSettings) => {
        if (!user) return;
        const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'userData', 'mainDoc');
        try {
          await setDoc(docRef, {
            items: updatedItems || items,
            wishlist: updatedWishlist || wishlist,
            notifications: updatedNotifications || notifications,
            settings: updatedSettings || settings,
            lastSaved: new Date().toISOString()
          }, { merge: true });
        } catch (e) {
          console.error("Failed to save state to Firestore:", e);
        }
      }, [user, items, wishlist, notifications, settings]);

      // Network and PWA Detection
      useEffect(() => {
        const handleOnline = () => { setIsOnline(true); setApiStatus('Connected'); };
        const handleOffline = () => { setIsOnline(false); setApiStatus('Offline'); };
        window.addEventListener('online', handleOnline);
        window.addEventListener('offline', handleOffline);

        // Check if standalone PWA or standard browser
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
        if (!isStandalone) {
          setShowPwaBanner(true);
        }

        return () => {
          window.removeEventListener('online', handleOnline);
          window.removeEventListener('offline', handleOffline);
        };
      }, []);

      const showToast = useCallback((message, type = 'success') => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3500);
      }, []);

      // Auto Market Refresh + Live Price Rise/Drop Notifications
      const refreshMarketData = useCallback(async () => {
        if ((items.length === 0 && wishlist.length === 0) || isUpdating || !isOnline) return;
        setIsUpdating(true);
        setApiStatus('Updating');
        let updatedCount = 0;
        let newNotes = [...notifications];
        
        try {
          const newItems = [...items];
          for (let i = 0; i < newItems.length; i++) {
            const item = newItems[i];
            try {
              const fresh = await RobloxAPI.getAsset(item.assetId);
              if (fresh.currentPrice !== item.currentPrice) {
                const diff = fresh.currentPrice - item.currentPrice;
                const isDrop = diff < 0;
                
                // Trigger notification for price change
                const note = {
                  id: Date.now() + Math.random(),
                  title: isDrop ? `Price Drop Alert: ${item.name}` : `Price Spike Alert: ${item.name}`,
                  message: `${item.name} has ${isDrop ? 'dropped' : 'risen'} to ${formatRobux(fresh.currentPrice, settings.currencyFormat)} (${isDrop ? '' : '+'}${formatRobux(diff, settings.currencyFormat)})`,
                  type: isDrop ? 'drop' : 'rise',
                  time: new Date().toISOString()
                };

                newNotes.unshift(note);
                showToast(note.message, isDrop ? 'success' : 'error');

                const newHistory = item.isLimited ? [...item.history, fresh.currentPrice] : [];
                if (newHistory.length > 30) newHistory.shift();
                newItems[i] = { ...item, ...fresh, history: newHistory, lastUpdated: new Date().toISOString() };
                updatedCount++;
              }
            } catch (err) {}
            await new Promise(r => setTimeout(r, 150));
          }

          if (updatedCount > 0) {
            setItems(newItems);
            setNotifications(newNotes);
            persistDataToCloud(newItems, wishlist, newNotes, settings);
          }
          setApiStatus('Connected');
        } catch (e) {
          setApiStatus('API Busy');
        } finally {
          setIsUpdating(false);
        }
      }, [items, wishlist, notifications, settings, isUpdating, isOnline, persistDataToCloud]);

      useEffect(() => {
        let interval;
        if (settings.autoRefresh && settings.refreshInterval > 0 && isOnline) {
          interval = setInterval(refreshMarketData, settings.refreshInterval * 1000);
        }
        return () => clearInterval(interval);
      }, [settings.autoRefresh, settings.refreshInterval, isOnline, refreshMarketData]);

      // Sync Inventory Automatically
      const syncRobloxInventory = async () => {
        if (!settings.profile.userId) {
          showToast("Please link your Roblox account in Settings first", "error");
          setActiveTab('settings');
          return;
        }
        setIsSyncingInventory(true);
        try {
          const invItems = await RobloxAPI.fetchUserInventory(settings.profile.userId);
          if (invItems.length === 0) {
            showToast("No collectibles found in inventory (or profile is private)", "error");
            setIsSyncingInventory(false);
            return;
          }

          const enriched = [];
          for (const inv of invItems) {
            const thumb = await RobloxAPI.getAssetThumbnail(inv.assetId);
            enriched.push(normalizeItem({
              ...inv,
              imageUrl: thumb,
              history: [inv.currentPrice]
            }));
            await new Promise(r => setTimeout(r, 100));
          }

          setItems(enriched);
          persistDataToCloud(enriched, wishlist, notifications, settings);
          showToast(`Successfully synced ${enriched.length} items from Roblox!`);
        } catch (e) {
          showToast(e.message || "Failed to sync inventory", "error");
        } finally {
          setIsSyncingInventory(false);
        }
      };

      // Statistics
      const stats = useMemo(() => {
        let totalValue = 0, totalInvested = 0, limitedsCount = 0;
        items.forEach(item => {
          totalValue += item.currentPrice * item.quantity;
          totalInvested += item.boughtPrice * item.quantity;
          if (item.isLimited) limitedsCount++;
        });
        const profit = totalValue - totalInvested;
        const roi = totalInvested > 0 ? (profit / totalInvested) * 100 : 0;
        return { 
          totalValue, 
          totalInvested, 
          profit, 
          roi, 
          isProfitable: profit >= 0,
          totalAssets: items.length,
          limitedsCount,
          wishlistCount: wishlist.length
        };
      }, [items, wishlist]);

      const profileDisplayImage = useMemo(() => {
        const p = settings.profile;
        if (p.customImage) return p.customImage;
        if (p.avatarUrl) return p.avatarUrl;
        return '';
      }, [settings.profile]);

      // ==========================================
      // VIEW RENDERERS
      // ==========================================

      const renderDashboard = () => (
        <div className="space-y-8 animate-in fade-in slide-in-from-bottom-8 duration-700">
          
          {/* Top Welcome Bar */}
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4">
            <div>
              <div className="flex items-center gap-2 mb-2">
                <span className="text-[10px] font-black bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 text-white px-3 py-1 rounded-full uppercase tracking-widest shadow-lg shadow-indigo-500/20 flex items-center gap-1.5">
                  <Sparkles className="w-3 h-3 animate-spin" /> RAPLY BY PAN
                </span>
                {user && (
                  <span className="text-[10px] font-bold text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2.5 py-0.5 rounded-full flex items-center gap-1">
                    <Cloud className="w-3 h-3" /> Cloud Synced
                  </span>
                )}
              </div>
              <h2 className="text-3xl md:text-4xl font-black text-white tracking-tight leading-none">
                Roblox Portfolio <br className="sm:hidden" />Analytics
              </h2>
              <div className="flex items-center gap-2 text-xs text-white/50 font-medium mt-2">
                {!isOnline ? (
                  <><Activity className="w-3.5 h-3.5 text-rose-500" /><span className="text-rose-400">Offline</span></>
                ) : isUpdating ? (
                  <><RefreshCw className="w-3.5 h-3.5 animate-spin text-emerald-400" /><span className="text-emerald-400">Syncing Market...</span></>
                ) : (
                  <><Clock className="w-3.5 h-3.5 text-indigo-400" /><span>API Status: <strong className="text-white">{apiStatus}</strong></span></>
                )}
              </div>
            </div>
            
            <div className="flex gap-2 w-full sm:w-auto">
              <button onClick={syncRobloxInventory} disabled={isSyncingInventory || !isOnline} className="flex-1 sm:flex-none flex items-center justify-center gap-2 px-5 py-3.5 glass-card hover:bg-white/10 active:scale-95 text-white rounded-2xl transition-all font-bold text-sm shadow-xl disabled:opacity-50">
                <RefreshCw className={`w-4 h-4 text-emerald-400 ${isSyncingInventory ? 'animate-spin' : ''}`} /> Sync Roblox
              </button>
              <button onClick={() => setIsAddOpen(true)} className="flex-1 sm:flex-none flex items-center justify-center gap-2 px-6 py-3.5 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-400 hover:to-purple-500 active:scale-95 text-white rounded-2xl font-bold transition-all shadow-lg shadow-indigo-500/30 text-sm">
                <Plus className="w-4 h-4" /> Add Asset
              </button>
            </div>
          </div>

          {/* Quick Stats Grid */}
          <div className="grid grid-cols-2 md:grid-cols-6 gap-3">
            <div className="glass-card rounded-2xl p-4 flex flex-col justify-between">
              <p className="text-[10px] text-white/50 uppercase font-bold tracking-wider">Total Holdings</p>
              <p className="text-2xl font-black text-white mt-1">{stats.totalAssets}</p>
            </div>
            <div className="glass-card rounded-2xl p-4 flex flex-col justify-between">
              <p className="text-[10px] text-white/50 uppercase font-bold tracking-wider">Limiteds</p>
              <p className="text-2xl font-black text-white mt-1">{stats.limitedsCount}</p>
            </div>
            <div className="glass-card rounded-2xl p-4 flex flex-col justify-between">
              <p className="text-[10px] text-white/50 uppercase font-bold tracking-wider">Wishlist Items</p>
              <p className="text-2xl font-black text-white mt-1">{stats.wishlistCount}</p>
            </div>
            <div className="col-span-2 md:col-span-3 glass-card rounded-2xl p-4 flex flex-col justify-between bg-gradient-to-r from-indigo-950/30 to-purple-950/30 border-indigo-500/20">
              <p className="text-[10px] text-indigo-300 uppercase font-bold tracking-wider">Net Portfolio Worth</p>
              <p className="text-2xl font-black text-white mt-1">
                <AnimatedNumber value={stats.totalValue} formatFn={(v) => formatRobux(v, settings.currencyFormat)} />
              </p>
            </div>
          </div>

          {/* Featured Glass Cards */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
            <GlassCard3D className="lg:col-span-2 relative overflow-hidden group">
              <div className="z-10 relative">
                <p className="text-white/60 text-sm font-semibold mb-2 flex items-center gap-2">
                  <Sparkles className="w-4 h-4 text-indigo-400" /> Overall Profit & Loss
                </p>
                <div className={`text-4xl md:text-5xl font-black tracking-tight mb-4 flex items-center gap-2 ${stats.isProfitable ? 'text-emerald-400' : 'text-rose-400'}`}>
                  {stats.profit > 0 ? '+' : ''}<AnimatedNumber value={stats.profit} formatFn={(v) => formatRobux(v, settings.currencyFormat)} />
                </div>
                <div className={`inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-sm font-bold backdrop-blur-md border ${stats.isProfitable ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-rose-500/10 text-rose-400 border-rose-500/20'}`}>
                  {stats.isProfitable ? <TrendingUp className="w-4 h-4" /> : <TrendingDown className="w-4 h-4" />}
                  {stats.roi.toFixed(2)}% ROI ({formatRobux(stats.totalInvested, settings.currencyFormat)} invested)
                </div>
              </div>
              <div className="absolute -right-10 -bottom-10 opacity-10 w-64 h-64 pointer-events-none transform group-hover:scale-110 group-hover:-rotate-12 transition-all duration-700 ease-out">
                <TrendingUp className="w-full h-full text-indigo-400" />

            <div className="glass-card rounded-3xl p-6 flex flex-col justify-between">
              <div className="flex justify-between items-center mb-4">

                  <Heart className="w-4 h-4 text-pink-400" /> Wishlist Tracker
                </h3>
                <button onClick={() => setActiveTab('wishlist')} className="text-xs font-bold text-white/60 hover:text-white transition-colors bg-white/5 px-3 py-1.5 rounded-lg border border-white/10">View All</button>
              </div>
              {wishlist.length === 0 ? (

                   <Heart className="w-8 h-8 text-white/10 mb-2" />
                   <p className="text-xs font-semibold text-white/40">No wishlist items tracked.</p>

              ) : (

                  {wishlist.slice(0, 3).map((w) => {

          {/* Holdings List */}
          {items.length === 0 ? (

              <div className="w-20 h-20 bg-indigo-500/10 border border-indigo-500/20 rounded-full flex items-center justify-center mb-5">

              <h3 className="text-xl font-bold text-white mb-2">Your portfolio is empty</h3>

                    </tr>

                  <tbody className="text-sm divide-y divide-white/5">
                    {[...items].sort((a,b) => (b.currentPrice * b.quantity) - (a.currentPrice * a.quantity)).map((item, index) => {

                <div>
                  <label className="block text-xs font-bold text-white/50 mb-2 uppercase">Asset URL or ID</label>
                  <input type="text" value={idInput} onChange={e => setIdInput(e.target.value)} placeholder="e.g. 19027209" className="w-full bg-white/5 border border-white/10 text-white rounded-2xl px-4 py-3.5 font-bold focus:outline-none focus:border-indigo-500" />
                </div>
                {error && <div className="p-3 bg-rose-500/10 border border-rose-500/20 text-rose-400 rounded-xl text-xs font-bold">{error}</div>}
                <button type="submit" disabled={loading || !idInput.trim()} className="w-full bg-indigo-600 text-white font-bold rounded-2xl py-3.5 flex justify-center items-center gap-2">
                  {loading ? <RefreshCw className="w-5 h-5 animate-spin" /> : <><Search className="w-5 h-5" /> Inspect Item</>}
                </button>
              </form>
            ) : (
              <div className="space-y-5">
                <div className="flex items-center gap-4 bg-white/5 p-4 rounded-2xl border border-white/10">
                  <RobloxImage src={preview.imageUrl} className="w-14 h-14 rounded-xl" />
                  <div className="flex-1 min-w-0">
                    <p className="text-sm font-bold text-white truncate">{preview.name}</p>
                    <p className="text-xs text-white/50 mt-1 font-semibold">Price: <span className="text-white font-bold">{formatRobux(preview.currentPrice, settings.currencyFormat)}</span></p>
                  </div>
                  <button onClick={() => setPreview(null)} className="p-2 text-white/50"><X className="w-5 h-5"/></button>
                </div>
                
                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-bold text-white/50 mb-2 uppercase">Target Price</label>
                    <input type="number" value={form.targetPrice} onChange={e => setForm({...form, targetPrice: e.target.value})} className="w-full bg-white/5 border border-white/10 text-white rounded-xl px-4 py-3 font-bold focus:outline-none" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-white/50 mb-2 uppercase">Saved Robux</label>
                    <input type="number" value={form.availableRobux} onChange={e => setForm({...form, availableRobux: e.target.value})} className="w-full bg-white/5 border border-white/10 text-white rounded-xl px-4 py-3 font-bold focus:outline-none" />
                  </div>
                </div>

                <button onClick={handleAdd} className="w-full bg-indigo-600 text-white font-bold rounded-2xl py-3.5">
                  Save Wishlist Item
                </button>
              </div>
            )}
          </Modal>
        );
      };

      const ItemDetailsModal = () => {
        if (!selectedItem) return null;
        
        const profit = (selectedItem.currentPrice - selectedItem.boughtPrice) * selectedItem.quantity;
        const roi = selectedItem.boughtPrice > 0 ? ((selectedItem.currentPrice - selectedItem.boughtPrice) / selectedItem.boughtPrice) * 100 : 0;
        const isProfitable = profit >= 0;
        
        const chartData = selectedItem.isLimited && selectedItem.history.length > 1 
          ? selectedItem.history 
          : [selectedItem.boughtPrice || selectedItem.currentPrice, selectedItem.currentPrice]; 

        const toggleFavorite = () => {
          const updated = items.map(i => i.id === selectedItem.id ? { ...i, isFavorite: !i.isFavorite } : i);
          setItems(updated);
          setSelectedItem(prev => ({ ...prev, isFavorite: !prev.isFavorite }));
          persistDataToCloud(updated, wishlist, notifications, settings);
        };

        const handleRemove = () => {
          const updated = items.filter(i => i.id !== selectedItem.id);
          setItems(updated);
          setSelectedItem(null);
          persistDataToCloud(updated, wishlist, notifications, settings);
          showToast("Asset removed");
        };

        return (
          <Modal isOpen={!!selectedItem} onClose={() => setSelectedItem(null)} title="Asset Details" maxWidth="max-w-xl">
            <div className="space-y-6">
              <div className="flex items-start gap-5">
                <RobloxImage src={selectedItem.imageUrl} className="w-28 h-28 rounded-2xl border border-white/10 p-2 flex-shrink-0" />
                <div className="flex-1 min-w-0">
                  <div className="flex justify-between items-start">
                    <div>
                      <h2 className="text-xl font-bold text-white truncate">{selectedItem.name}</h2>
                      <p className="text-xs text-white/40 font-mono mt-0.5">Asset ID: {selectedItem.assetId}</p>
                    </div>
                    <button onClick={toggleFavorite} className="p-2 text-white/60 hover:text-white">
                      <Star className={`w-6 h-6 ${selectedItem.isFavorite ? 'text-amber-400 fill-amber-400' : ''}`} />
                    </button>
                  </div>
                  
                  <div className="mt-4 flex gap-6">
                    <div>
                      <p className="text-[10px] text-white/40 uppercase font-bold">Market Price</p>
                      <p className="text-base font-black text-white">{formatRobux(selectedItem.currentPrice, settings.currencyFormat)}</p>
                    </div>
                    <div>
                      <p className="text-[10px] text-white/40 uppercase font-bold">Quantity</p>
                      <p className="text-base font-black text-white">{selectedItem.quantity}</p>
                    </div>
                  </div>
                </div>
              </div>

              {selectedItem.isLimited && (
                <div className="bg-white/5 border border-white/10 rounded-2xl p-4">
                  <h3 className="text-xs font-bold text-white/40 uppercase tracking-widest mb-3">Price Trend (RAP)</h3>
                  <div className="h-28 w-full">
                    <SmoothSparkline data={chartData} isPositive={isProfitable} />
                  </div>
                </div>
              )}

              <div className="grid grid-cols-2 gap-3">
                 <div className="bg-white/5 p-4 rounded-xl border border-white/10">
                   <p className="text-[10px] text-white/40 uppercase font-bold">Bought Price</p>
                   <p className="text-sm font-bold text-white">{formatRobux(selectedItem.boughtPrice, settings.currencyFormat)}</p>
                </div>
                <div className="bg-white/5 p-4 rounded-xl border border-white/10">
                   <p className="text-[10px] text-white/40 uppercase font-bold">Net Profit/Loss</p>
                   <p className={`text-sm font-black ${isProfitable ? 'text-emerald-400' : 'text-rose-400'}`}>
                     {profit > 0 ? '+' : ''}{formatRobux(profit, settings.currencyFormat)} ({roi.toFixed(1)}%)
                   </p>
                </div>
              </div>

              <button onClick={handleRemove} className="w-full py-3.5 bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 rounded-xl text-xs font-bold transition-all border border-rose-500/20">
                Remove Asset
              </button>
            </div>
          </Modal>
        );
      };

      const WishlistDetailsModal = () => {
        if (!selectedWishlistItem) return null;

        const handleRemove = () => {
          const updated = wishlist.filter(w => w.id !== selectedWishlistItem.id);
          setWishlist(updated);
          setSelectedWishlistItem(null);
          persistDataToCloud(items, updated, notifications, settings);
          showToast("Item removed from wishlist");
        };

        return (
          <Modal isOpen={!!selectedWishlistItem} onClose={() => setSelectedWishlistItem(null)} title="Wishlist Details">
            <div className="space-y-6">
              <div className="flex items-center gap-4">
                <RobloxImage src={selectedWishlistItem.imageUrl} className="w-20 h-20 rounded-2xl border border-white/10 p-1" />
                <div className="flex-1 min-w-0">
                  <h2 className="text-lg font-bold text-white truncate">{selectedWishlistItem.name}</h2>
                  <p className="text-xs text-white/50 mt-1">Current Price: <strong className="text-white">{formatRobux(selectedWishlistItem.currentPrice, settings.currencyFormat)}</strong></p>
                </div>
              </div>

              <div className="bg-white/5 p-4 rounded-2xl border border-white/10 space-y-3 text-xs">
                <div className="flex justify-between">
                  <span className="text-white/50">Target Price</span>
                  <span className="text-white font-bold">{formatRobux(selectedWishlistItem.targetPrice, settings.currencyFormat)}</span>
                </div>
                <div className="flex justify-between">
                  <span className="text-white/50">Saved Robux</span>
                  <span className="text-white font-bold">{formatRobux(selectedWishlistItem.availableRobux, settings.currencyFormat)}</span>
                </div>
              </div>

              <button onClick={handleRemove} className="w-full py-3.5 bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 rounded-xl text-xs font-bold">
                Stop Tracking Item
              </button>
            </div>
          </Modal>
        );
      };

      // Desktop & Mobile Navigation Item
      const NavItem = ({ id, icon, label, isMobile, badge }) => {
        const isActive = activeTab === id;
        if (isMobile) {
          return (
            <button onClick={() => setActiveTab(id)} className={`flex flex-col items-center justify-center w-full h-full gap-1 relative ${isActive ? 'text-white' : 'text-white/40'}`}>
              {isActive && <div className="absolute top-1 w-1.5 h-1.5 bg-indigo-500 rounded-full" />}
              {badge > 0 && <span className="absolute top-1 right-1/4 w-4 h-4 bg-rose-500 text-white text-[9px] font-bold rounded-full flex items-center justify-center">{badge}</span>}
              {React.cloneElement(icon, { className: `w-5 h-5 transition-transform ${isActive ? 'scale-110' : ''}` })}
              <span className="text-[10px] font-bold">{label}</span>
            </button>
          );
        }
        return (
          <button onClick={() => setActiveTab(id)} className={`w-full flex items-center justify-between px-4 py-3 rounded-2xl transition-all ${isActive ? 'bg-indigo-600 text-white font-bold shadow-lg shadow-indigo-600/30' : 'text-white/50 font-semibold hover:text-white hover:bg-white/5'}`}>
            <div className="flex items-center gap-3.5">
              {React.cloneElement(icon, { className: 'w-5 h-5' })}
              <span className="text-sm">{label}</span>
            </div>
            {badge > 0 && <span className="bg-rose-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">{badge}</span>}
          </button>
        );
      };

      return (
        <div className="flex h-[100dvh] w-full bg-[#030305] text-slate-100 font-sans selection:bg-indigo-500/30 overflow-hidden">
          
          {/* Desktop Glass Navigation Sidebar */}
          <aside className="hidden md:flex flex-col w-72 border-r border-white/10 z-40 relative glass-card">
            <div className="h-20 flex items-center justify-between px-6">
              <div>
                <h1 className="text-xl font-black tracking-[0.2em] text-white">RAPLY</h1>
                <p className="text-[10px] text-indigo-400 font-bold tracking-widest uppercase">By Pan</p>
              </div>
            </div>

            <nav className="flex-1 space-y-1.5 px-4">
              <NavItem id="home" icon={<LayoutDashboard />} label="Dashboard" />
              <NavItem id="portfolio" icon={<Wallet />} label="Portfolio" />
              <NavItem id="wishlist" icon={<Heart />} label="Wishlist" badge={wishlist.filter(w => w.isAffordable).length} />
              <NavItem id="favorites" icon={<Star />} label="Pinned" />
              <NavItem id="alerts" icon={<Bell />} label="Price Alerts" badge={notifications.length} />
              <NavItem id="settings" icon={<SettingsIcon />} label="Settings" />
            </nav>
            
            <div className="p-4 border-t border-white/10">
              <button onClick={() => setIsSearchOpen(true)} className="w-full flex items-center gap-3 px-4 py-3 bg-white/5 hover:bg-white/10 border border-white/10 rounded-2xl text-white/50 text-sm font-bold transition-all">
                <Search className="w-5 h-5" /> 
                <span>Search Portfolio</span>
              </button>
            </div>
          </aside>

          {/* Main Content Pane */}
          <main className="flex-1 relative flex flex-col h-full overflow-hidden">
            {/* Top Bar for PWA Mobile Banner */}
            {showPwaBanner && (
              <div className="bg-indigo-600/90 backdrop-blur-md px-4 py-2.5 text-xs text-white font-medium flex items-center justify-between z-30">
                <div className="flex items-center gap-2 truncate">
                  <PhoneIcon className="w-4 h-4 flex-shrink-0" />
                  <span className="truncate">Add Raply to home screen for full app view</span>
                </div>
                <button onClick={() => setIsPwaTutorialOpen(true)} className="underline font-bold ml-2 flex-shrink-0">
                  How?
                </button>
              </div>
            )}

            {/* Mobile Top Header */}
            <div className="md:hidden flex items-center justify-between px-5 h-16 border-b border-white/10 glass-card z-30">
              <div>
                <h1 className="text-lg font-black tracking-[0.2em] text-white">RAPLY</h1>
              </div>
              <button onClick={() => setIsSearchOpen(true)} className="p-2 text-white/60 bg-white/5 rounded-full">
                <Search className="w-4 h-4" />
              </button>
            </div>

            <div className="flex-1 overflow-y-auto custom-scrollbar p-4 md:p-8 lg:p-10 pb-28 md:pb-10">
              <div className="max-w-5xl mx-auto">
                {activeTab === 'home' && renderDashboard()}
                {activeTab === 'portfolio' && renderPortfolio()}
                {activeTab === 'wishlist' && renderWishlist()}
                {activeTab === 'favorites' && renderFavorites()}
                {activeTab === 'alerts' && renderNotifications()}
                {activeTab === 'settings' && renderSettings()}
              </div>
            </div>
          </main>

          {/* Mobile Glass Bottom Bar */}
          <nav className="md:hidden fixed bottom-0 inset-x-0 glass-card border-t border-white/10 z-40 pb-safe">
            <div className="flex justify-around items-center h-16 px-2">
              <NavItem id="home" icon={<LayoutDashboard />} label="Home" isMobile />
              <NavItem id="portfolio" icon={<Wallet />} label="Assets" isMobile />
              <NavItem id="wishlist" icon={<Heart />} label="Wishlist" isMobile badge={wishlist.filter(w => w.isAffordable).length} />
              <NavItem id="alerts" icon={<Bell />} label="Alerts" isMobile badge={notifications.length} />
              <NavItem id="settings" icon={<SettingsIcon />} label="Settings" isMobile />
            </div>
          </nav>

          {/* Toast Notification Container */}
          <div className="fixed bottom-20 md:bottom-8 right-0 left-0 md:left-auto md:right-8 flex flex-col items-center md:items-end gap-2.5 z-[60] pointer-events-none px-4 md:px-0">
            {toasts.map(toast => (
              <div key={toast.id} className="pointer-events-auto flex items-center gap-3 bg-slate-900/90 backdrop-blur-xl border border-white/15 text-white px-4 py-3 rounded-2xl shadow-2xl animate-in slide-in-from-bottom-4">
                {toast.type === 'error' ? <AlertCircle className="w-4 h-4 text-rose-400" /> : <CheckCircle2 className="w-4 h-4 text-emerald-400" />}
                <span className="text-xs font-bold">{toast.message}</span>
              </div>
            ))}
          </div>

          {/* Modals */}
          <AddModal />
          <AddWishlistModal />
          <ItemDetailsModal />
          <WishlistDetailsModal />
          <SearchModal />
          <PwaTutorialModal />

        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
